<style>
/* Simple and soft: blush-white paper, quiet cards, bright lavender, mint and pink for your plans. */
:root{--bg:#f8f3f4;--bg2:#efe7ea;--card:#fffcfd;--ink:#2a2530;--soft:#867d8c;--faint:#bdb4c0;--rule:rgba(42,37,48,.08);--fill:rgba(42,37,48,.045);--acc:#8a72ee;--pa:#5cc79f;--pb:#9d86f4;--pg:#f19ab9;--good:#4fb488;--bad:#d4586a;--red:#d4586a;--shadow:0 1px 2px rgba(60,40,70,.04),0 10px 28px rgba(90,60,110,.07);--serif:Fraunces,Georgia,"Times New Roman",serif;--ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.ava.pic{background:var(--p) var(--img) center/cover;color:transparent}

.evr.fill,.evr.glass{grid-template-columns:auto minmax(0,1fr) auto;margin:8px 0;border-bottom:0;--c:var(--pg)}
.evr.fill{padding:12px 14px 12px 12px;border-radius:18px;background:color-mix(in srgb,var(--c) 30%,var(--card));color:var(--ink)}
.evr.glass::before{content:"";position:absolute;left:-14px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--c);transform:translateY(-50%)}
.ei{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--c) 55%,var(--card));color:color-mix(in srgb,var(--c) 45%,var(--ink));font-style:normal}
.ei:empty{width:6px;height:auto;align-self:stretch;min-height:30px;border-radius:99px;background:var(--c)}

.ei .ic{width:18px;height:18px}

.evr.glass,.dvev.glass{isolation:isolate;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 46%,rgba(255,255,255,0) 47%,rgba(255,255,255,.12) 100%),linear-gradient(120deg,color-mix(in srgb,var(--c) 52%,#fff) 0%,color-mix(in srgb,var(--c) 30%,#fff) 55%,color-mix(in srgb,var(--c) 62%,#fff) 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 0 1px rgba(255,255,255,.35),0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 10px 22px -8px color-mix(in srgb,var(--c) 80%,transparent);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.evr.glass{position:relative;margin-left:22px;width:calc(100% - 22px);padding:11px 14px 11px 10px;border-radius:20px}
.evr.glass::before{content:"";position:absolute;left:-15px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);transform:translateY(-50%)}
.dvev.glass{align-items:center;margin-left:6px;border-radius:14px;padding:6px 10px}
:root[data-theme="dark"] .evr.glass,:root[data-theme="dark"] .dvev.glass{border-color:rgba(255,255,255,.32);background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08) 100%),radial-gradient(120px 70px at 10% 85%,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%),radial-gradient(140px 80px at 96% -10%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.06),0 12px 28px -8px color-mix(in srgb,var(--c) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .evr.glass,:root:not([data-theme="light"]) .dvev.glass{border-color:rgba(255,255,255,.32);background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08) 100%),radial-gradient(120px 70px at 10% 85%,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%),radial-gradient(140px 80px at 96% -10%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.06),0 12px 28px -8px color-mix(in srgb,var(--c) 45%,transparent)}}
.evr.fill .et,.evr.glass .et{color:color-mix(in srgb,var(--ink) 70%,transparent)}

.evr small{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:13.5px;color:var(--soft);min-width:0}.evr small span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}

/* ---------- Effects around a day (and its events in day view) ---------- */
@property --fxa{syntax:"<angle>";initial-value:0deg;inherits:false}
.fx{position:relative;--fxc:var(--acc)}
.fx::before,.fx::after{content:"";position:absolute;pointer-events:none;z-index:1}
/* Glow: a soft light that breathes */
.fx-glow{animation:fxglow 2.6s ease-in-out infinite}
@keyframes fxglow{0%,100%{box-shadow:0 0 8px 1px color-mix(in srgb,var(--fxc) 40%,transparent)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--fxc) 20%,transparent),0 0 22px 6px color-mix(in srgb,var(--fxc) 55%,transparent)}}
/* Rainbow: a turning ring of colour */
.fx-rainbow{box-shadow:0 0 14px 2px color-mix(in srgb,#a996f7 35%,transparent),0 0 10px 1px color-mix(in srgb,#f5a3c7 30%,transparent)}
.fx-rainbow::before{inset:-3.5px;border-radius:inherit;background:conic-gradient(from var(--fxa),#f5a3c7,#f3d679,#7dd6b0,#82c3f5,#a996f7,#f5a3c7);animation:fxspin 3.2s linear infinite}
.fx-rainbow::before{padding:2.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@keyframes fxspin{to{--fxa:360deg}}
/* Sparkle: little stars that twinkle around it */
.fx-sparkle{--fxc:#f0bf3c;box-shadow:0 0 12px 1px color-mix(in srgb,var(--fxc) 35%,transparent)}
.fx-sparkle::before,.fx-sparkle::after{inset:-10px;background:radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.2px) 6% 10%/9px 9px no-repeat,radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.4px) 96% 18%/11px 11px no-repeat,radial-gradient(circle,#fff 0 .8px,var(--fxc) 1.4px,transparent 2.8px) 88% 96%/8px 8px no-repeat,radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.2px) 4% 86%/10px 10px no-repeat;animation:fxtw 1.9s ease-in-out infinite}
.fx-sparkle::after{background-position:50% 0%,100% 62%,45% 100%,0% 42%;animation-delay:.95s}
@keyframes fxtw{0%,100%{opacity:0;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
/* Hearts: small hearts floating up */
.fx-hearts{--fxc:#f08bb0;box-shadow:0 0 12px 1px color-mix(in srgb,var(--fxc) 35%,transparent)}
.fx-hearts::before,.fx-hearts::after{content:"♥";top:-7px;right:-6px;color:var(--fxc);font:12px/1 var(--ui);opacity:.9;animation:fxheart 2.6s ease-in infinite}
.fx-hearts::after{right:auto;left:-6px;top:35%;font-size:9px;animation-delay:1.3s}
@keyframes fxheart{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.15) rotate(-12deg)}}
.cgr b.fx{z-index:1}.dvev.fx{z-index:2}
/* Choosing an effect */
.fxs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}

/* Side menu */

#drawer.on{transform:none}
.dbrand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}.dbrand img{width:44px;height:44px;border-radius:12px}.dbrand b{display:block;font:500 21px/1.1 var(--serif)}.dbrand small{display:block;font-size:13px;color:var(--soft);margin-top:2px}

@media (hover:hover){#drawer>button.di:hover{background:var(--fill)}}

/* Month: taller days with the events written out */
.cgr{gap:3px 2px}

@media (max-width:559px){#k_cal{margin:0 -12px;padding:14px 4px 10px;border-radius:22px}#k_cal .mnav{padding:0 10px}.cwk.wkn,.cgr.wkn{grid-template-columns:15px repeat(7,minmax(0,1fr))}.cgr{gap:3px 1px}.cgr .v{font-size:9.5px}}

.sh{padding-top:calc(28px + var(--sat))}.box{max-height:calc(100dvh - 38px - var(--sat) - var(--sab))}
/* Room above the first hour so its time label is not cut off. */
.dvb{margin-top:10px}

/* Background: a faint mist in the app's own soft tones that drifts slowly behind everything. */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky i{--k:color-mix(in srgb,var(--acc) 16%,var(--card));position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--k) 0,color-mix(in srgb,var(--k) 60%,transparent) 45%,transparent 100%);opacity:.75;will-change:transform;animation:drift var(--t) ease-in-out infinite alternate}

.sky i:nth-child(3){--k:color-mix(in srgb,var(--pg) 14%,var(--card));--t:47s;width:130vmax;height:58vmax;left:-40vmax;top:48vmax;--x:26vmax;--y:-8vmax;--s:.95}
.sky i:nth-child(4){--k:var(--card);--t:38s;width:100vmax;height:46vmax;right:-30vmax;bottom:-12vmax;--x:-28vmax;--y:-6vmax;--s:1.2}

let mmEnterAt=0;$("mm_body").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.isTrusted)mmEnterAt=Date.now()},true);
$("mm_body").addEventListener("submit",e=>{e.preventDefault();const inp=e.target.querySelector("input");if(!inp||Date.now()-mmEnterAt<400)return;inp.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}))});
/* In ordinary text, a line that starts with "-", "•" or "1." carries on as a list when you press Enter. */
$("mm_body").addEventListener("beforeinput",e=>{if(e.target.tagName!=="TEXTAREA"||(e.inputType!=="insertLineBreak"&&e.inputType!=="insertParagraph"))return;const d=e.target.closest(".mb");if(!d||d.dataset.s)return;
  const ta=e.target,v=ta.value,pos=ta.selectionStart;if(pos!==ta.selectionEnd)return;const a=v.lastIndexOf("\n",pos-1)+1,line=v.slice(a,pos),mt=line.match(/^(\s*)([-•*]|(\d+)([.)]))\s+/);if(!mt)return;e.preventDefault();
  if(line.slice(mt[0].length).trim()===""&&v.slice(pos,v.indexOf("\n",pos)<0?v.length:v.indexOf("\n",pos)).trim()===""){ta.value=v.slice(0,a)+v.slice(pos);ta.setSelectionRange(a,a)}
  else{const nx=mt[1]+(mt[3]?(+mt[3]+1)+mt[4]:mt[2])+" ";ta.value=v.slice(0,pos)+"\n"+nx+v.slice(pos);const q=pos+1+nx.length;ta.setSelectionRange(q,q)}
  mmGrow(ta);mmLinks(d);mmChanged()});
/* ---------- Folding lists ----------
   A named list can be folded to just its name and progress. Which lists are folded is kept on this phone only,
   so folding a list never folds it for your partner. */
const FK="kalenderkoll.fold";
function foldSet(){try{return new Set(JSON.parse(localStorage.getItem(FK)||"[]"))}catch(e){return new Set()}}
function foldSave(S2){try{localStorage.setItem(FK,JSON.stringify([...S2].slice(-400)))}catch(e){}}
const _mbBlock2=mmBlock;mmBlock=function(b){const d=_mbBlock2(b);if(b.t==="lh"){const f=document.createElement("button");f.type="button";f.className="mbfold";f.setAttribute("aria-label",tx("Fäll ihop eller ut","Fold or unfold"));
  f.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>';d.prepend(f);if(MM&&MM.id&&foldSet().has(MM.id+":"+d.dataset.b))d.classList.add("fold")}return d};
const _prog2=mmProg;mmProg=function(){_prog2();$("mm_body").querySelectorAll(".mb-c").forEach(c=>c.classList.remove("hid"));
  $("mm_body").querySelectorAll(".mb-lh.fold").forEach(h=>{for(let x=h.nextElementSibling;x&&x.dataset.t==="c";x=x.nextElementSibling)x.classList.add("hid")})};
function mmFold(h,on){if(on===undefined)on=!h.classList.contains("fold");
  /* Items fold away one after another from the bottom, and open from the top, for a soft ripple. */
  {const G=[];for(let x=h.nextElementSibling;x&&x.dataset.t==="c";x=x.nextElementSibling)G.push(x);const n=G.length;G.forEach((x,i)=>x.style.setProperty("--i",Math.min(8,on?n-1-i:i)));}
  try{if(navigator.vibrate)navigator.vibrate(6)}catch(e){}h.classList.toggle("fold",on);const S2=foldSet(),k=MM.id+":"+h.dataset.b;if(on)S2.add(k);else S2.delete(k);foldSave(S2);
  /* The line you were writing on is not hidden away. */
  if(on){const a=mmCur();if(a&&a.dataset.t==="c"&&a!==h){let x=a;while(x&&x.dataset.t==="c")x=x.previousElementSibling;if(x===h)h.querySelector("input").focus()}}mmProg()}
$("mm_body").addEventListener("click",e=>{const f=e.target.closest(".mbfold");if(!f)return;e.stopPropagation();mmFold(f.closest(".mb"))},true);
/* Pressing Enter on a folded list's name opens it and goes to its first point. */
$("mm_body").addEventListener("keydown",e=>{const d=e.target.closest&&e.target.closest(".mb-lh.fold");if(d&&e.key==="Enter")mmFold(d,false)},true);

/* ---------- The Lista button: a menu of list kinds ----------
   Pick checkboxes, bullets or numbers, or a new list with a name. Inside a list the same choice changes that list. */
const mmMakeList=$("mm_chk").onclick;
function mmLst(open){const f=$("mm_lst");if(open===undefined)open=f.hidden;f.hidden=!open;$("mm_chk").classList.toggle("on",open);if(!open)return;mmFmt(false);mmSym(false);
  const d=mmTarget(),G=d&&(d.dataset.t==="c"||d.dataset.t==="lh")?mmGroup(d):[],cur=G.length?(G[0].dataset.m||"c"):"";
  const prev={c:'<i class="pc"></i><i class="pc on"></i><i class="pc"></i>',b:'<i class="pb"></i><i class="pb"></i><i class="pb"></i>',n:'<i class="pn">1</i><i class="pn">2</i><i class="pn">3</i>'};
  f.innerHTML=`<p>${G.length?tx("Ändra listan till","Change the list to"):tx("Lägg till en lista","Add a list")}</p><div class="mmlk">${MKIND.map(([v,i,l])=>`<button type="button" data-lk="${v}" class="${cur===v?"on":""}"><span class="lkp">${prev[v]}</span><b>${l}</b></button>`).join("")}</div>
    <button type="button" class="mmln" data-lk="named"><span class="lkh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></span><span><b>${tx("Ny lista med rubrik","New list with a name")}</b><small>${tx("Med namn och en stapel som visar hur mycket som är klart. Kan fällas ihop.","With a name and a bar showing how much is done. Can be folded.")}</small></span></button>`}
$("mm_chk").onclick=()=>mmLst();$("mm_lst").addEventListener("mousedown",e=>e.preventDefault());
const _fmt3=mmFmt;mmFmt=function(open){if(open===undefined)open=$("mm_fmt").hidden;if(open)mmLst(false);_fmt3(open)};
const _sym3=mmSym;mmSym=function(open){if(open===undefined)open=$("mm_sym").hidden;if(open)mmLst(false);_sym3(open)};
const _close3=closeMM;closeMM=function(){mmLst(false);_close3()};
function mmSetKind(L,v){L.forEach(x=>{if(v==="c")delete x.dataset.m;else{x.dataset.m=v;x.classList.remove("done");const ck=x.querySelector(".mbck");if(ck)ck.classList.remove("on")}})}
$("mm_lst").addEventListener("click",e=>{const b=e.target.closest("[data-lk]");if(!b)return;const v=b.dataset.lk,d=mmTarget();
  if(v==="named"){const at=d||$("mm_body").lastElementChild,h=mmBlock({t:"lh",x:""});
    if(at&&at.dataset.t==="p"&&!at.querySelector("textarea").value.trim())at.replaceWith(h);else if(at){let x=at;if(x.dataset.t==="c"||x.dataset.t==="lh"){const G=mmGroup(x);if(G.length)x=G[G.length-1]}x.after(h)}else $("mm_body").appendChild(h);
    const c=mmBlock({t:"c",x:"",d:false});h.after(c);if(!c.nextElementSibling||c.nextElementSibling.dataset.t!=="p")c.after(mmBlock({t:"p",x:""}));h.querySelector("input").focus();mmChanged();mmLst(false);return}
  const G=d&&(d.dataset.t==="c"||d.dataset.t==="lh")?mmGroup(d):[];
  if(G.length){mmSetKind(G,v);mmChanged();mmFocusEnd(d);mmLst(false);return}
  if(d)mmFocusEnd(d);mmMakeList();const n=mmCur();if(n&&n.dataset.t==="c"){mmSetKind(mmGroup(n),v);mmChanged()}mmLst(false)});

/* ---------- Jump to a heading or list ----------
   A small flap on the left edge appears when a note has headings or named lists.
   Tap it for a short list of them; tap one and the note scrolls there. */
function tocItems(){return[...$("mm_body").querySelectorAll(":scope>.mb-h1,:scope>.mb-h2,:scope>.mb-lh")].map(d=>({d,lv:d.classList.contains("mb-h1")?1:d.classList.contains("mb-h2")?2:3,x:(d.querySelector("textarea,input")||{}).value||""})).filter(o=>o.x.trim())}
function tocPaint(){const L=tocItems();$("toc_f").classList.toggle("hide",L.length<2);if(L.length<2)tocOpen(false);
  if($("toc_p").classList.contains("on"))$("toc_p").innerHTML=`<p>${tx("Hoppa till","Jump to")}</p>`+L.map((o,i)=>`<button type="button" data-toc="${i}" class="lv${o.lv}"${o.d.dataset.k?` style="--tc:${MCOL[o.d.dataset.k]}"`:""}>${o.lv===3?'<span class="tl"></span>':""}${esc(o.x)}</button>`).join("")}
function tocOpen(on){const p=$("toc_p");if(on===undefined)on=!p.classList.contains("on");p.classList.toggle("on",on);p.setAttribute("aria-hidden",String(!on));$("toc_f").classList.toggle("on",on);if(on)tocPaint()}
$("toc_f").onclick=()=>tocOpen();
$("toc_p").addEventListener("click",e=>{const b=e.target.closest("[data-toc]");if(!b)return;const o=tocItems()[+b.dataset.toc];tocOpen(false);if(!o)return;
  const w=$("mm_w"),y=o.d.getBoundingClientRect().top-w.getBoundingClientRect().top+w.scrollTop-14;w.scrollTo({top:Math.max(0,y),behavior:"smooth"});
  /* A soft glow shows where you landed; folded lists open. */
  if(o.d.classList.contains("fold"))mmFold(o.d,false);o.d.classList.remove("flash");void o.d.offsetWidth;o.d.classList.add("flash")});
$("mm_w").addEventListener("click",()=>tocOpen(false));
const _prog3=mmProg;mmProg=function(){_prog3();tocPaint()};
const _close4=closeMM;closeMM=function(){tocOpen(false);_close4()};

/* Tapping the progress side of a list's name also folds it. */
$("mm_body").addEventListener("click",e=>{const pr=e.target.closest(".mb-lh .mbprog");if(pr)mmFold(pr.closest(".mb"))});

/* Items in a named list carry the list's colour, so their frame can be tinted to match the glass header. */
const _prog4=mmProg;mmProg=function(){_prog4();$("mm_body").querySelectorAll(".mb-lh").forEach(h=>{const c=h.dataset.k&&MCOL[h.dataset.k]||"";for(let x=h.nextElementSibling;x&&x.dataset.t==="c";x=x.nextElementSibling){if(c)x.style.setProperty("--lc",c);else x.style.removeProperty("--lc")}})};
</script>
