<style>
/* Simple and soft: blush-white paper, quiet cards, bright lavender, mint and pink for your plans. */
:root{--bg:#f8f3f4;--bg2:#efe7ea;--card:#fffcfd;--ink:#2a2530;--soft:#867d8c;--faint:#bdb4c0;--rule:rgba(42,37,48,.08);--fill:rgba(42,37,48,.045);--acc:#8a72ee;--pa:#5cc79f;--pb:#9d86f4;--pg:#f19ab9;--good:#4fb488;--bad:#d4586a;--red:#d4586a;--shadow:0 1px 2px rgba(60,40,70,.04),0 10px 28px rgba(90,60,110,.07);--serif:Fraunces,Georgia,"Times New Roman",serif;--ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--bg2:#1c1922;--card:#211d28;--ink:#f1ecf6;--soft:#a69daf;--faint:#6e6577;--rule:rgba(241,236,246,.09);--fill:rgba(241,236,246,.06);--acc:#a996ff;--pa:#74d6ad;--pb:#b3a2ff;--pg:#f4a8c3;--good:#7fd4a8;--bad:#f08a98;--red:#f08a98;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131a;--bg2:#1c1922;--card:#211d28;--ink:#f1ecf6;--soft:#a69daf;--faint:#6e6577;--rule:rgba(241,236,246,.09);--fill:rgba(241,236,246,.06);--acc:#a996ff;--pa:#74d6ad;--pb:#b3a2ff;--pg:#f4a8c3;--good:#7fd4a8;--bad:#f08a98;--red:#f08a98;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);color-scheme:dark}
/* Space for the phone's status bar and home bar. The Android app also passes these in as --safe-area-inset-*. */
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--topH:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;color:var(--ink);font:16px/1.45 var(--ui);font-variant-numeric:tabular-nums;
  background:transparent;
  padding:calc(var(--topH) + var(--sat) + 4px) max(16px,env(safe-area-inset-right,0px)) calc(96px + var(--sab)) max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:var(--ink);min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:12px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
/* Top bar */
/* The bar is pinned to the very top of the screen and stays there while you scroll. */
.top{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;gap:4px;min-height:calc(var(--topH) + var(--sat));padding:calc(3px + var(--sat)) max(10px,calc((100% - 560px)/2 - 6px)) 3px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-bottom-color:var(--rule)}
h1{flex:1;margin:0;padding-left:2px;font:500 25px/1.4 var(--serif);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}.ib svg{width:22px;height:22px}
.ib.add{width:40px;height:40px;margin-left:6px;border-radius:13px;background:var(--acc);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 40%,transparent)}.ib.add svg{stroke-width:2.2}
/* Cards and text */
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}

.muted{margin:4px 0 0;font-size:14.5px;color:var(--soft)}
.big{font:400 46px/1.05 var(--serif);letter-spacing:-.02em;margin-top:6px;overflow-wrap:anywhere}.big.word{font-size:34px}
.lnk{color:var(--acc);font-weight:600;font-size:14.5px;padding:6px 0}.lnk.bad{color:var(--bad)}.wide{width:100%;text-align:center}
.hello{padding:4px 2px 2px}.hello h2{margin:4px 0 0;font:400 30px/1.15 var(--serif);letter-spacing:-.01em}
.note,.empty{margin:6px 0 2px;font-size:14.5px;color:var(--soft)}
/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:650;font-size:16px}

.btn.ghost,.btn.out{background:var(--fill);color:var(--ink);border:0}.btn.bad{color:var(--bad)}
.btn svg{width:20px;height:20px;stroke-width:2.2}
.card .btn.wide{display:flex;width:100%;margin-top:10px}
.field{display:flex;align-items:center;width:100%;min-height:50px;padding:0 14px;border:1px solid var(--rule);border-radius:14px;background:var(--fill);font-size:16px;text-align:left}

.field:focus{outline:0;border-color:var(--acc)}
.field.empty,.field.empty span{color:var(--soft)}
.big-in{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 2px 10px;font:400 26px/1.2 var(--serif);border-radius:0}.big-in:focus{outline:0;border-color:var(--acc)}.big-in::placeholder{color:var(--faint)}
.fl{margin:16px 0 7px;font-size:13px;font-weight:600;color:var(--soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair+.pair{margin-top:8px}
.tog.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--fill)}.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:0;padding:0 6px;border-radius:11px;font-size:14.5px;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(43,38,34,.12)}
.seg button span{overflow:hidden;text-overflow:ellipsis}
.seg small{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--fill);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--rule);font-size:14.5px;font-weight:600;color:var(--soft)}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.more{margin-top:14px;font-size:14.5px;font-weight:600;color:var(--acc)}
.acts{display:flex;gap:8px;margin-top:20px}.acts .btn{flex:1}
.links{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.addb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border-radius:16px;background:color-mix(in srgb,var(--acc) 10%,var(--fill));color:var(--acc);font-weight:650;font-size:15px}
/* People */
.ava{--p:var(--pg);display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;font:600 11px/1 var(--ui);font-style:normal;box-shadow:0 0 0 2px var(--card)}
.ava.pic{background:var(--p) var(--img) center/cover;color:transparent}
.cspic{display:flex;align-items:center;gap:12px;margin-top:6px}.cspic .btn{min-height:42px;padding:0 16px}
.ava.xl{width:64px;height:64px;font:400 28px/1 var(--serif)}
.ava2{display:inline-flex;flex:none}.ava2 .ava+.ava{margin-left:-7px}
/* Event rows */
.evr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--rule);text-align:left}
.evr:last-child{border-bottom:0}
/* Two styles: a coloured block, and an indented glassy pill. */
.evr.fill,.evr.glass{grid-template-columns:auto minmax(0,1fr) auto;margin:8px 0;border-bottom:0;--c:var(--pg)}
.evr.fill{padding:12px 14px 12px 12px;border-radius:18px;background:color-mix(in srgb,var(--c) 30%,var(--card));color:var(--ink)}
.evr.glass::before{content:"";position:absolute;left:-14px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--c);transform:translateY(-50%)}
.ei{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--c) 55%,var(--card));color:color-mix(in srgb,var(--c) 45%,var(--ink));font-style:normal}
.ei:empty{width:6px;height:auto;align-self:stretch;min-height:30px;border-radius:99px;background:var(--c)}
.evr.glass .ei{width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.6);color:color-mix(in srgb,var(--c) 50%,var(--ink));box-shadow:inset 0 1px 0 #fff,0 2px 6px color-mix(in srgb,var(--c) 45%,transparent)}.evr.glass .ei:empty{width:8px;height:8px;min-height:0;align-self:center;margin-left:6px;background:var(--c)}
.ei .ic{width:18px;height:18px}
/* Glass: tinted frosted glass. The colour is in the glass itself, with a bright rim and a sheen across the top. */
.evr.glass,.dvev.glass{isolation:isolate;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 46%,rgba(255,255,255,0) 47%,rgba(255,255,255,.12) 100%),linear-gradient(120deg,color-mix(in srgb,var(--c) 52%,#fff) 0%,color-mix(in srgb,var(--c) 30%,#fff) 55%,color-mix(in srgb,var(--c) 62%,#fff) 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 0 1px rgba(255,255,255,.35),0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 10px 22px -8px color-mix(in srgb,var(--c) 80%,transparent);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.evr.glass{position:relative;margin-left:22px;width:calc(100% - 22px);padding:11px 14px 11px 10px;border-radius:20px}
.evr.glass::before{content:"";position:absolute;left:-15px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);transform:translateY(-50%)}
.dvev.glass{align-items:center;margin-left:6px;border-radius:14px;padding:6px 10px}
:root[data-theme="dark"] .evr.glass,:root[data-theme="dark"] .dvev.glass{border-color:rgba(255,255,255,.32);background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08) 100%),radial-gradient(120px 70px at 10% 85%,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%),radial-gradient(140px 80px at 96% -10%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.06),0 12px 28px -8px color-mix(in srgb,var(--c) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .evr.glass,:root:not([data-theme="light"]) .dvev.glass{border-color:rgba(255,255,255,.32);background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08) 100%),radial-gradient(120px 70px at 10% 85%,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%),radial-gradient(140px 80px at 96% -10%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.06),0 12px 28px -8px color-mix(in srgb,var(--c) 45%,transparent)}}
.evr.fill .et,.evr.glass .et{color:color-mix(in srgb,var(--ink) 70%,transparent)}
.evr.fill small,.evr.glass small{color:color-mix(in srgb,var(--ink) 62%,transparent)}
.evr .ava{box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--card)) 25%,var(--card))}
.evr b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.evr small{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:13.5px;color:var(--soft);min-width:0}.evr small span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evr .et{font-size:14.5px;font-weight:600;color:var(--soft);white-space:nowrap;text-align:right}
.evr.now .et{color:var(--acc);font-weight:700}.evr.past{opacity:.5}
.evr.soft b{font-weight:500}.evr.red b{color:var(--red)}
.dayh{margin:14px 0 0;font-size:13px;font-weight:600;color:var(--soft)}.dayh:first-child{margin-top:4px}
/* This week */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px}
.wstrip small{font-size:11.5px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}.wstrip b{font:400 21px/1.1 var(--serif)}
.wstrip .t{background:var(--acc);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}.wstrip .t small{color:inherit;opacity:.7}.wstrip .red b{color:var(--red)}.wstrip .t.red b{color:inherit}.wstrip .past{opacity:.45}
.dots{display:flex;gap:3px;height:5px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--p)}
/* Month */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 8px}.mnav b{font:500 20px/1.2 var(--serif);text-transform:capitalize}.mnav button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%}.mnav button svg{width:20px;height:20px}
.cwk,.cgr,.dgr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cwk.wkn,.cgr.wkn{grid-template-columns:20px repeat(7,minmax(0,1fr))}
.cwk span{padding:2px 0 8px;text-align:center;font-size:11.5px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.cgr .v,.cwk .v{display:grid;place-items:center;font-size:10.5px;font-weight:500;color:var(--faint);text-transform:none;letter-spacing:0}
.cgr button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;border-radius:12px;min-width:0}
.cgr button b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-weight:500;font-size:15.5px}
.cgr .out{opacity:.3}.cgr .red b{color:var(--red)}.cgr .t b{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}.cgr .s b{background:var(--acc);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 40%,transparent)}
/* Date picker and time picker */
.dgr button{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:15.5px}.dgr i{aspect-ratio:1}.dgr .t{box-shadow:inset 0 0 0 1.5px var(--ink)}.dgr .s{background:var(--acc);color:#fff}.dgr .red{color:var(--red)}.dgr .s.red{color:var(--card)}
.tpv{margin:6px 0 12px;text-align:center;font:400 44px/1 var(--serif)}
.tgr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:12px}.tgr button{height:42px;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px}.tgr .s{background:var(--acc);color:#fff}
#pk_l{max-height:52vh;overflow-y:auto;margin:10px 0}.pko{display:block;width:100%;padding:12px 14px;border-radius:12px;text-align:left;font-size:16px}.pko.on{background:var(--acc);color:#fff}
/* Sheets */
.sh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:10px;padding-bottom:calc(10px + var(--sab));background:rgba(30,25,22,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.sh.on{opacity:1;pointer-events:auto}.sh.mid{align-items:center}
.box{width:min(100%,460px);max-height:calc(100dvh - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateY(20px);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sh.on .box{transform:none}
.bh{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px 6px 0}.bh b,.title{display:block;font:500 21px/1.25 var(--serif)}
.box .muted{margin:6px 0 4px}
#dp,#tp,#pk,#sc{z-index:56}#modal{z-index:60}
.opt{display:block;width:100%;margin-top:8px;padding:13px 14px;border-radius:14px;background:var(--fill);text-align:left;font-weight:600}.opt small{display:block;margin-top:2px;font-size:13.5px;font-weight:500;color:var(--soft)}.opt.bad{color:var(--bad)}
.box .btn.wide{display:flex;width:100%;margin-top:14px}
/* To do */
.todo{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:50px;border-bottom:1px solid var(--rule)}.todo:last-child{border-bottom:0}
.tchk{display:grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--faint);border-radius:50%;color:transparent;transition:background .2s,border-color .2s}
.tchk svg{width:14px;height:14px;stroke-width:2.6}.tchk.on{background:var(--good);border-color:var(--good);color:#fff}
.tn{width:100%;border:0;background:none;padding:12px 0;font-size:16px;overflow-wrap:anywhere}input.tn:focus{outline:0}
.todo.done .tn{color:var(--soft);text-decoration:line-through}
.x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--faint)}.x svg{width:14px;height:14px;stroke-width:2}.x.arm{background:var(--bad);color:#fff}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.addrow input{height:50px;padding:0 14px;border:1px solid var(--rule);border-radius:14px;background:var(--fill);font-size:16px}.addrow input:focus{outline:0;border-color:var(--acc)}.addrow .btn{width:50px;padding:0}
#t_seg{margin-bottom:6px}
.tdone{margin-top:12px}.tdone summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--soft);padding:8px 0}.tdone summary::-webkit-details-marker{display:none}
/* Us */
.us{text-align:center;padding:24px 18px}
.duo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}.duo>span{display:flex;flex-direction:column;align-items:center;gap:7px}.duo b{font-weight:600;font-size:15px}.duo i.h{font-style:normal;color:var(--acc);font-size:20px;margin-top:-22px}
.ann{margin:14px auto 0;padding-top:14px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--ink);max-width:340px}

/* ---------- Effects around a day (and its events in day view) ---------- */
@property --fxa{syntax:"<angle>";initial-value:0deg;inherits:false}
.fx{position:relative;--fxc:var(--acc)}
.fx::before,.fx::after{content:"";position:absolute;pointer-events:none;z-index:1}
/* Glow: a soft light that breathes */
.fx-glow{animation:fxglow 2.6s ease-in-out infinite}
@keyframes fxglow{0%,100%{box-shadow:0 0 8px 1px color-mix(in srgb,var(--fxc) 40%,transparent)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--fxc) 20%,transparent),0 0 22px 6px color-mix(in srgb,var(--fxc) 55%,transparent)}}
/* Rainbow: a turning ring of colour */
.fx-rainbow{box-shadow:0 0 14px 2px color-mix(in srgb,#a996f7 35%,transparent),0 0 10px 1px color-mix(in srgb,#f5a3c7 30%,transparent)}
.fx-rainbow::before{inset:-3.5px;border-radius:inherit;background:conic-gradient(from var(--fxa),#f5a3c7,#f3d679,#7dd6b0,#82c3f5,#a996f7,#f5a3c7);animation:fxspin 3.2s linear infinite}
.fx-rainbow::before{padding:2.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@keyframes fxspin{to{--fxa:360deg}}
/* Sparkle: little stars that twinkle around it */
.fx-sparkle{--fxc:#f0bf3c;box-shadow:0 0 12px 1px color-mix(in srgb,var(--fxc) 35%,transparent)}
.fx-sparkle::before,.fx-sparkle::after{inset:-10px;background:radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.2px) 6% 10%/9px 9px no-repeat,radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.4px) 96% 18%/11px 11px no-repeat,radial-gradient(circle,#fff 0 .8px,var(--fxc) 1.4px,transparent 2.8px) 88% 96%/8px 8px no-repeat,radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.2px) 4% 86%/10px 10px no-repeat;animation:fxtw 1.9s ease-in-out infinite}
.fx-sparkle::after{background-position:50% 0%,100% 62%,45% 100%,0% 42%;animation-delay:.95s}
@keyframes fxtw{0%,100%{opacity:0;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
/* Hearts: small hearts floating up */
.fx-hearts{--fxc:#f08bb0;box-shadow:0 0 12px 1px color-mix(in srgb,var(--fxc) 35%,transparent)}
.fx-hearts::before,.fx-hearts::after{content:"♥";top:-7px;right:-6px;color:var(--fxc);font:12px/1 var(--ui);opacity:.9;animation:fxheart 2.6s ease-in infinite}
.fx-hearts::after{right:auto;left:-6px;top:35%;font-size:9px;animation-delay:1.3s}
@keyframes fxheart{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.15) rotate(-12deg)}}
.cgr b.fx{z-index:1}.dvev.fx{z-index:2}
/* Choosing an effect */
.fxs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}

/* Side menu */

#drawer.on{transform:none}
.dbrand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}.dbrand img{width:44px;height:44px;border-radius:12px}.dbrand b{display:block;font:500 21px/1.1 var(--serif)}.dbrand small{display:block;font-size:13px;color:var(--soft);margin-top:2px}

@media (hover:hover){#drawer>button.di:hover{background:var(--fill)}}

/* Month: taller days with the events written out */
.cgr{gap:3px 2px}

@media (max-width:559px){#k_cal{margin:0 -12px;padding:14px 4px 10px;border-radius:22px}#k_cal .mnav{padding:0 10px}.cwk.wkn,.cgr.wkn{grid-template-columns:15px repeat(7,minmax(0,1fr))}.cgr{gap:3px 1px}.cgr .v{font-size:9.5px}}

.sh{padding-top:calc(28px + var(--sat))}.box{max-height:calc(100dvh - 38px - var(--sat) - var(--sab))}
/* Room above the first hour so its time label is not cut off. */
.dvb{margin-top:10px}

/* Background: a faint mist in the app's own soft tones that drifts slowly behind everything. */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky i{--k:color-mix(in srgb,var(--acc) 16%,var(--card));position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--k) 0,color-mix(in srgb,var(--k) 60%,transparent) 45%,transparent 100%);opacity:.75;will-change:transform;animation:drift var(--t) ease-in-out infinite alternate}

.sky i:nth-child(3){--k:color-mix(in srgb,var(--pg) 14%,var(--card));--t:47s;width:130vmax;height:58vmax;left:-40vmax;top:48vmax;--x:26vmax;--y:-8vmax;--s:.95}
.sky i:nth-child(4){--k:var(--card);--t:38s;width:100vmax;height:46vmax;right:-30vmax;bottom:-12vmax;--x:-28vmax;--y:-6vmax;--s:1.2}

const LOCAL=!!window.KK_LOCAL;
/* Shared between the two of you: the Claude version always, the installed version when Firebase is reachable. */
const SHARED=()=>!LOCAL||!!(window.KK&&KK.mode==="cloud");
/* The shared version of the app, for inviting each other. */

const T={nH:["Idag","Today"],nK:["Kalender","Calendar"],nT:["Att göra","To do"],nV:["Vi","Us"],ttlH:["Idag","Today"],ttlK:["Kalender","Calendar"],ttlT:["Att göra","To do"],ttlV:["Vi två","The two of us"],ttlC:["Inställningar","Settings"]};
const t=k=>T[k][li()];

/* The two of you: a and b, and g for things you do together. ua/ub tie a name to a signed-in person. */
let CP={a:"",b:"",ua:"",ub:"",since:"",ca:"",cb:""},ME="",MYID="";
try{const m=localStorage.getItem("kalenderkoll.me");if(m==="a"||m==="b")ME=m}catch(e){}
const other=w=>w==="a"?"b":"a",me=()=>ME||"a";

  try{seen=localStorage.getItem(JK)}catch(e){}
  if(seen===id)return;try{localStorage.setItem(JK,id)}catch(e){}
  /* Only tell you about a change you did not already see: a partner who joins after you started. */
  if(seen!==null&&id!=="none"&&id!==MYID){const p=pname(o),msg=tx(`${p} har gått med i er kalender`,`${p} has joined your calendar`);
    toast("💞 "+msg+" · "+tx("Nu ser ni samma kalender.","Now you see the same calendar."),6000);notify("Kalenderkoll",msg)}}

/* A notice when your partner adds something. This phone keeps a list of what it has already seen;
   anything new that this phone did not write itself comes from your partner. */
const SK="kalenderkoll.seen";let askedN=false;
function watchNew(){const ids=Object.keys(DOCS).filter(id=>/^(ev|note|todo|bd)_/.test(id));let seen=null;
  try{const r=localStorage.getItem(SK);if(r)seen=new Set(JSON.parse(r))}catch(e){}
  const fresh=seen?ids.filter(id=>!seen.has(id)):[];if(seen&&!fresh.length)return;
  try{localStorage.setItem(SK,JSON.stringify([...new Set([...(seen||[]),...ids])].slice(-4000)))}catch(e){}
  const news=fresh.filter(id=>!MINE.has(id));if(!seen||!news.length||!SHARED()||!ME)return;
  const p=pname(other(ME)),v=DOCS[news[0]]||{},q=s=>String(s||"").slice(0,60);
  const msg=news.length>1?tx(`${p} har lagt till ${news.length} nya saker`,`${p} added ${news.length} new things`):
    v.kind==="ev"?tx(`${p} lade till: ${q(v.n)}`,`${p} added: ${q(v.n)}`)+(v.d?" ("+fmtD(dn(v.d),{day:"numeric",month:"short"})+")":""):
    v.kind==="note"?tx(`${p} skrev en lapp: ${q(v.txt)}`,`${p} wrote a note: ${q(v.txt)}`):
    v.kind==="todo"?tx(`${p} lade till en uppgift: ${q(v.n)}`,`${p} added a task: ${q(v.n)}`):
    tx(`${p} lade till en speciell dag: ${q(v.n)}`,`${p} added a special day: ${q(v.n)}`);
  toast(msg,5000);notify("Kalenderkoll",msg)}
/* The phone asks once whether the app may show notifications, the first time you tap something in a shared calendar. */
document.addEventListener("click",()=>{if(askedN||!SHARED()||!ME)return;askedN=true;askNotify()});
/* Installed version: when a newer build is published, offer to update. */
const BUILD=(document.querySelector('meta[name="kal-build"]')||{}).content||"";
async function checkUpdate(){if(!LOCAL||!BUILD||!navigator.onLine)return;try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
  if(j&&j.b&&j.b!==BUILD){const u=$("upd");u.dataset.v=j.b;$("upd_t").textContent=tx("Ny version finns","New version ready");$("upd_s").textContent=tx("Allt ni lagt in finns kvar.","Everything you added stays.");$("upd_go").textContent=tx("Uppdatera","Update");u.classList.remove("hide")}}catch(e){}}
$("upd").onclick=()=>{location.replace(location.pathname+"?v="+($("upd").dataset.v||Date.now()))};
if(/[?&]v=/.test(location.search))history.replaceState(history.state,"",location.pathname+location.hash);
setTimeout(checkUpdate,4000);setInterval(checkUpdate,15*6e4);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
/* ---------- Backups ----------
   A backup is one small file with everything in the calendar, plus which shared calendar it is and who you are.
   In the Android app a fresh copy is written to Documents › Kalenderkoll after every change.
   After a reinstall you pick that file under Restore, and the app joins the same shared calendar again. */
function NATIVE(){return!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}
function FSP(){return NATIVE()&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem||null}
/* Plain var and function so the settings page can use these while the app is still starting. */
var BKN="Kalenderkoll-sakerhetskopia.json",BKK="kalenderkoll.backup";
function bkInfo(){try{return JSON.parse(localStorage.getItem(BKK)||"{}")||{}}catch(e){return{}}}
function bkLast(){const t=bkInfo().at;if(!t)return"";const d=new Date(t);return isNaN(d)?"":fmtD(dnOf(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function backupText(){return JSON.stringify({app:"kalenderkoll",v:1,at:new Date().toISOString(),space:window.KK&&KK.space?KK.space():"",me:ME||"",docs:DOCS},null,1)}
/* Saves a file where the person can find it: Documents › Kalenderkoll in the Android app, a download elsewhere. */
async function saveFile(name,text,mime){const F=FSP();
  if(F){try{await F.writeFile({path:"Kalenderkoll/"+name,data:text,directory:"DOCUMENTS",encoding:"utf8",recursive:true});toast(tx("Sparad i Dokument › Kalenderkoll","Saved in Documents › Kalenderkoll")+" · "+name);return true}
    catch(e){try{const n2=name.replace(/(\.\w+)$/,"-"+Date.now()+"$1");await F.writeFile({path:"Kalenderkoll/"+n2,data:text,directory:"DOCUMENTS",encoding:"utf8",recursive:true});toast(tx("Sparad i Dokument › Kalenderkoll","Saved in Documents › Kalenderkoll")+" · "+n2);return true}catch(e2){toast(tx("Kunde inte spara filen","Could not save the file"));return false}}}
  if(!LOCAL){try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:text});return true}}catch(e){return false}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
/* Automatic copy in the Android app. If a file from an earlier install is in the way, this install keeps its own file. */
var bkTimer=0,bkPrev="";
function autoBackup(){const F=FSP();if(!F||!hasData())return;clearTimeout(bkTimer);bkTimer=setTimeout(async()=>{
  const body=JSON.stringify(DOCS);if(body===bkPrev)return;const info=bkInfo(),name=info.name||BKN,txt=backupText();
  const w=n=>F.writeFile({path:"Kalenderkoll/"+n,data:txt,directory:"DOCUMENTS",encoding:"utf8",recursive:true});
  try{await w(name)}catch(e){const n2="Kalenderkoll-sakerhetskopia-"+isoOf(new Date())+".json";try{await w(n2);info.name=n2}catch(e2){return}}
  bkPrev=body;info.at=new Date().toISOString();try{localStorage.setItem(BKK,JSON.stringify(info))}catch(e){}if(tab==="c")renderSettings()},3000)}
async function restoreFrom(file){let b;try{b=JSON.parse(await file.text())}catch(e){b=null}
  if(!b||b.app!=="kalenderkoll"||typeof b.docs!=="object"){toast(tx("Det där är ingen säkerhetskopia från Kalenderkoll","That is not a Kalenderkoll backup"));return}
  const n=Object.values(b.docs).filter(v=>v&&v.kind==="ev").length,when=b.at?fmtD(dnOf(new Date(b.at))):"";
  if(!await ask(tx("Återställa kalendern?","Restore the calendar?"),tx(`Säkerhetskopian${when?" från "+when:""} har ${n} händelser. Är ni ihop kopplas du till er delade kalender igen.`,`The backup${when?" from "+when:""} has ${n} events. If you are a couple, you are connected to your shared calendar again.`),tx("Återställ","Restore")))return;
  if(window.KK&&KK.restore)KK.restore(b)}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("#bk_save,#bk_load,#cs_rs");if(!t)return;
  if(t.id==="bk_save"){if(!hasData()){toast(tx("Det finns inget att spara än","There is nothing to save yet"));return}saveFile(NATIVE()?BKN.replace(".json","-"+isoOf(new Date())+".json"):"kalenderkoll-sakerhetskopia-"+isoOf(new Date())+".json",backupText(),"application/json")}
  else{$("bk_in").value="";$("bk_in").click()}});
$("bk_in").addEventListener("change",()=>{const f=$("bk_in").files[0];if(f)restoreFrom(f)});
/* ---------- Account (optional) ----------
   E-mail and password. Creating one upgrades this phone's sign-in, so nothing changes in the calendar.
   Logging in on a newly installed app brings back the calendar and who you are. */
var ASM="up";
function openAS(mode){ASM=mode;const up=mode==="up";
  $("as_t").textContent=up?tx("Skapa konto","Create an account"):tx("Logga in","Log in");
  $("as_p").textContent=up?tx("Med ett konto får du tillbaka kalendern om du installerar om appen eller byter telefon.","With an account you get the calendar back if you reinstall the app or change phones."):hasData()?tx("Kalendern på den här telefonen byts mot den som hör till kontot.","The calendar on this phone is replaced by the one that belongs to the account."):tx("Logga in så hämtas din kalender.","Log in and your calendar is fetched.");
  $("as_el").textContent=tx("E-post","E-mail");$("as_wl").textContent=up?tx("Välj ett lösenord (minst 6 tecken)","Pick a password (at least 6 characters)"):tx("Lösenord","Password");$("as_w").autocomplete=up?"new-password":"current-password";$("as_w").value="";
  $("as_no").textContent=tx("Avbryt","Cancel");$("as_ok").textContent=up?tx("Skapa konto","Create account"):tx("Logga in","Log in");$("as_ok").disabled=false;
  $("as_sw").textContent=up?tx("Jag har redan ett konto","I already have an account"):tx("Skapa ett nytt konto","Create a new account");$("as_fp").textContent=tx("Glömt lösenordet?","Forgot the password?");$("as_fp").classList.toggle("hide",up);
  $("as").classList.add("on");setTimeout(()=>($("as_e").value?$("as_w"):$("as_e")).focus(),80)}
function closeAS(){$("as").classList.remove("on")}
function accErr(e){const c=e&&e.code||"";return c==="auth/operation-not-allowed"?tx("Inloggning med e-post är inte påslagen i Firebase än","E-mail sign-in is not turned on in Firebase yet"):
  c==="auth/email-already-in-use"||c==="auth/credential-already-in-use"?tx("Det finns redan ett konto med den e-posten. Välj Jag har redan ett konto.","There is already an account with that e-mail. Choose I already have an account."):
  c==="auth/weak-password"?tx("Lösenordet behöver minst 6 tecken","The password needs at least 6 characters"):
  c==="auth/invalid-email"?tx("E-postadressen ser inte rätt ut","That e-mail address does not look right"):
  c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"?tx("Fel e-post eller lösenord","Wrong e-mail or password"):
  c==="auth/too-many-requests"?tx("För många försök. Vänta en stund.","Too many tries. Wait a little."):
  c==="kk/no-link"?tx("Kontot har ingen kalender kopplad","That account has no calendar connected"):
  tx("Det gick inte. Kontrollera internet och försök igen.","That did not work. Check the internet and try again.")}
$("as_no").onclick=closeAS;$("as").addEventListener("click",e=>{if(e.target===$("as"))closeAS()});
$("as_sw").onclick=()=>openAS(ASM==="up"?"in":"up");
$("as_fp").onclick=async()=>{const em=$("as_e").value.trim();if(!em){toast(tx("Skriv din e-post först","Write your e-mail first"));$("as_e").focus();return}
  try{await KK.resetPw(em);toast(tx("Om kontot finns har vi skickat ett mejl med en länk för nytt lösenord","If the account exists, we sent an e-mail with a link for a new password"),6000)}catch(e){toast(accErr(e))}};
$("as_ok").onclick=async()=>{const em=$("as_e").value.trim(),pw=$("as_w").value;if(!em){$("as_e").focus();return}if(pw.length<6){toast(tx("Lösenordet behöver minst 6 tecken","The password needs at least 6 characters"));$("as_w").focus();return}
  if(!(window.KK&&KK.signUp)){toast(tx("Ingen kontakt med internet just nu","No internet connection right now"));return}
  $("as_ok").disabled=true;
  try{if(ASM==="up"){await KK.signUp(em,pw);closeAS();toast(tx("Kontot är skapat","The account is created")+" · "+em);renderSettings()}else{await KK.signIn(em,pw)}}
  catch(e){$("as_ok").disabled=false;toast(accErr(e),5000)}};
document.addEventListener("click",e=>{if(!e.target.closest)return;const b=e.target.closest("[data-acc]");if(b)openAS(b.dataset.acc);else if(e.target.closest("#cs_li"))openAS("in")});
</script>
