<style>
/* Simple and soft: blush-white paper, quiet cards, bright lavender, mint and pink for your plans. */
/* Colours are written in OKLCH (lightness, colour strength, hue), so tints and shades stay even to the eye.
   Tints are mixed in OKLab, the same colour space without the hue wheel, so a colour mixed with a neutral keeps its own hue. */
:root{--bg:oklch(.968 .006 355);--bg2:oklch(.935 .01 352);--card:oklch(.994 .003 355);--card2:oklch(.994 .003 355);--card3:oklch(.994 .003 355);--ink:oklch(.275 .021 306);--soft:oklch(.603 .025 312);--faint:oklch(.781 .019 318);--rule:oklch(.275 .021 306/.08);--fill:oklch(.275 .021 306/.045);--acc:oklch(.634 .179 289);--pa:oklch(.755 .116 166);--pb:oklch(.688 .158 291);--pg:oklch(.782 .11 357);--good:oklch(.698 .116 162);--bad:oklch(.623 .157 14);--red:oklch(.623 .157 14);--hi:transparent;--shadow:0 1px 2px oklch(.3 .05 320/.04),0 10px 28px oklch(.4 .08 310/.07);--serif:Fraunces,Georgia,"Times New Roman",serif;--ui:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(.175 .012 300);--bg2:oklch(.205 .015 300);--card:oklch(.235 .018 300);--card2:oklch(.275 .02 300);--card3:oklch(.315 .022 300);--ink:oklch(.95 .014 308);--soft:oklch(.709 .028 308);--faint:oklch(.521 .03 308);--rule:oklch(.95 .014 308/.1);--fill:oklch(.95 .014 308/.07);--acc:oklch(.733 .149 291);--pa:oklch(.805 .111 165);--pb:oklch(.763 .132 291);--pg:oklch(.812 .095 356);--good:oklch(.804 .105 160);--bad:oklch(.746 .125 12);--red:oklch(.746 .125 12);--hi:oklch(1 0 0/.07);--shadow:inset 0 1px 0 oklch(1 0 0/.06),0 1px 2px oklch(0 0 0/.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:oklch(.175 .012 300);--bg2:oklch(.205 .015 300);--card:oklch(.235 .018 300);--card2:oklch(.275 .02 300);--card3:oklch(.315 .022 300);--ink:oklch(.95 .014 308);--soft:oklch(.709 .028 308);--faint:oklch(.521 .03 308);--rule:oklch(.95 .014 308/.1);--fill:oklch(.95 .014 308/.07);--acc:oklch(.733 .149 291);--pa:oklch(.805 .111 165);--pb:oklch(.763 .132 291);--pg:oklch(.812 .095 356);--good:oklch(.804 .105 160);--bad:oklch(.746 .125 12);--red:oklch(.746 .125 12);--hi:oklch(1 0 0/.07);--shadow:inset 0 1px 0 oklch(1 0 0/.06),0 1px 2px oklch(0 0 0/.3);color-scheme:dark}
/* Space for the phone's status bar and home bar. The Android app also passes these in as --safe-area-inset-*. */
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--topH:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;color:var(--ink);font:16px/1.45 var(--ui);font-variant-numeric:tabular-nums;
  background:transparent;
  padding:calc(var(--topH) + var(--sat) + 4px) max(16px,env(safe-area-inset-right,0px)) calc(96px + var(--sab)) max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:var(--ink);min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:12px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
/* Top bar */
/* The bar is pinned to the very top of the screen and stays there while you scroll. */
.top{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;gap:4px;min-height:calc(var(--topH) + var(--sat));padding:calc(3px + var(--sat)) max(10px,calc((100% - 560px)/2 - 6px)) 3px;background:color-mix(in oklab,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-bottom-color:var(--rule)}
h1{flex:1;margin:0;padding-left:2px;font:500 25px/1.4 var(--serif);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}.ib svg{width:22px;height:22px}
.ib.add{width:40px;height:40px;margin-left:6px;border-radius:13px;background:var(--acc);color:#fff;box-shadow:0 8px 20px color-mix(in oklab,var(--acc) 40%,transparent)}.ib.add svg{stroke-width:2.2}
/* Cards and text */
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
h3{margin:0;font:500 19px/1.25 var(--serif)}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.muted{margin:4px 0 0;font-size:14.5px;color:var(--soft)}
.big{font:400 46px/1.05 var(--serif);letter-spacing:-.02em;margin-top:6px;overflow-wrap:anywhere}.big.word{font-size:34px}
.lnk{color:var(--acc);font-weight:600;font-size:14.5px;padding:6px 0}.lnk.bad{color:var(--bad)}.wide{width:100%;text-align:center}
.hello{padding:4px 2px 2px}.hello h2{margin:4px 0 0;font:400 30px/1.15 var(--serif);letter-spacing:-.01em}
.note,.empty{margin:6px 0 2px;font-size:14.5px;color:var(--soft)}
/* Buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:650;font-size:16px}
a.btn{text-decoration:none}
.btn.ghost,.btn.out{background:var(--fill);color:var(--ink);border:0}.btn.bad{color:var(--bad)}
.btn svg{width:20px;height:20px;stroke-width:2.2}
.card .btn.wide{display:flex;width:100%;margin-top:10px}
.field{display:flex;align-items:center;width:100%;min-height:50px;padding:0 14px;border:1px solid var(--rule);border-radius:14px;background:var(--fill);font-size:16px;text-align:left}
textarea.field{padding:12px 14px;line-height:1.45;resize:vertical}
.field:focus{outline:0;border-color:var(--acc)}
.field.empty,.field.empty span{color:var(--soft)}
.big-in{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 2px 10px;font:400 26px/1.2 var(--serif);border-radius:0}.big-in:focus{outline:0;border-color:var(--acc)}.big-in::placeholder{color:var(--faint)}
.fl{margin:16px 0 7px;font-size:13px;font-weight:600;color:var(--soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair+.pair{margin-top:8px}
.tog.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--fill)}.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:0;padding:0 6px;border-radius:11px;font-size:14.5px;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(43,38,34,.12)}
.seg button span{overflow:hidden;text-overflow:ellipsis}
.seg small{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--fill);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--rule);font-size:14.5px;font-weight:600;color:var(--soft)}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.more{margin-top:14px;font-size:14.5px;font-weight:600;color:var(--acc)}
.acts{display:flex;gap:8px;margin-top:20px}.acts .btn{flex:1}
.links{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.addb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border-radius:16px;background:color-mix(in oklab,var(--acc) 10%,var(--fill));color:var(--acc);font-weight:650;font-size:15px}
/* People */
.ava{--p:var(--pg);display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;font:600 11px/1 var(--ui);font-style:normal;box-shadow:0 0 0 2px var(--card)}
.ava.pic{background:var(--p) var(--img) center/cover;color:transparent}
.cspic{display:flex;align-items:center;gap:12px;margin-top:6px}.cspic .btn{min-height:42px;padding:0 16px}
.ava.xl{width:64px;height:64px;font:400 28px/1 var(--serif)}
.ava2{display:inline-flex;flex:none}.ava2 .ava+.ava{margin-left:-7px}
/* Event rows */
.evr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--rule);text-align:left}
.evr:last-child{border-bottom:0}
/* Two styles: a coloured block, and an indented glassy pill. */
.evr.fill,.evr.glass{grid-template-columns:auto minmax(0,1fr) auto;margin:8px 0;border-bottom:0;--c:var(--pg)}
.evr.fill{padding:12px 14px 12px 12px;border-radius:18px;background:color-mix(in oklab,var(--c) 30%,var(--card));color:var(--ink)}
.evr.glass::before{content:"";position:absolute;left:-14px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--c);transform:translateY(-50%)}
.ei{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in oklab,var(--c) 55%,var(--card));color:color-mix(in oklab,var(--c) 45%,var(--ink));font-style:normal}
.ei:empty{width:6px;height:auto;align-self:stretch;min-height:30px;border-radius:99px;background:var(--c)}
.evr.glass .ei{width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.6);color:color-mix(in oklab,var(--c) 50%,var(--ink));box-shadow:inset 0 1px 0 #fff,0 2px 6px color-mix(in oklab,var(--c) 45%,transparent)}.evr.glass .ei:empty{width:8px;height:8px;min-height:0;align-self:center;margin-left:6px;background:var(--c)}
.ei .ic{width:18px;height:18px}
/* Glass: tinted frosted glass. The colour is in the glass itself, with a bright rim and a sheen across the top. */
.evr.glass,.dvev.glass{isolation:isolate;border:1.5px solid color-mix(in oklab,var(--c) 30%,#fff);
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 46%,rgba(255,255,255,0) 47%,rgba(255,255,255,.12) 100%),linear-gradient(120deg,color-mix(in oklab,var(--c) 52%,#fff) 0%,color-mix(in oklab,var(--c) 30%,#fff) 55%,color-mix(in oklab,var(--c) 62%,#fff) 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 color-mix(in oklab,var(--c) 45%,transparent),inset 0 0 0 1px rgba(255,255,255,.35),0 0 0 1px color-mix(in oklab,var(--c) 55%,transparent),0 10px 22px -8px color-mix(in oklab,var(--c) 80%,transparent);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.evr.glass{position:relative;margin-left:22px;width:calc(100% - 22px);padding:11px 14px 11px 10px;border-radius:20px}
.evr.glass::before{content:"";position:absolute;left:-15px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 22%,transparent);transform:translateY(-50%)}
.dvev.glass{align-items:center;margin-left:6px;border-radius:14px;padding:6px 10px}
:root[data-theme="dark"] .evr.glass,:root[data-theme="dark"] .dvev.glass{border-color:rgba(255,255,255,.32);background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08) 100%),radial-gradient(120px 70px at 10% 85%,color-mix(in oklab,var(--c) 55%,transparent),transparent 72%),radial-gradient(140px 80px at 96% -10%,color-mix(in oklab,var(--c) 30%,transparent),transparent 70%),color-mix(in oklab,var(--c) 14%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.06),0 12px 28px -8px color-mix(in oklab,var(--c) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .evr.glass,:root:not([data-theme="light"]) .dvev.glass{border-color:rgba(255,255,255,.32);background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08) 100%),radial-gradient(120px 70px at 10% 85%,color-mix(in oklab,var(--c) 55%,transparent),transparent 72%),radial-gradient(140px 80px at 96% -10%,color-mix(in oklab,var(--c) 30%,transparent),transparent 70%),color-mix(in oklab,var(--c) 14%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.06),0 12px 28px -8px color-mix(in oklab,var(--c) 45%,transparent)}}
.evr.fill .et,.evr.glass .et{color:color-mix(in oklab,var(--ink) 70%,transparent)}
.evr.fill small,.evr.glass small{color:color-mix(in oklab,var(--ink) 62%,transparent)}
.evr .ava{box-shadow:0 0 0 2px color-mix(in oklab,var(--c,var(--card)) 25%,var(--card))}
.evr b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.evr small{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:13.5px;color:var(--soft);min-width:0}.evr small span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evr .et{font-size:14.5px;font-weight:600;color:var(--soft);white-space:nowrap;text-align:right}
.evr.now .et{color:var(--acc);font-weight:700}.evr.past{opacity:.5}
.evr.soft b{font-weight:500}.evr.red b{color:var(--red)}
.dayh{margin:14px 0 0;font-size:13px;font-weight:600;color:var(--soft)}.dayh:first-child{margin-top:4px}
/* This week */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px}
.wstrip small{font-size:11.5px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}.wstrip b{font:400 21px/1.1 var(--serif)}
.wstrip .t{background:var(--acc);color:#fff;box-shadow:0 6px 16px color-mix(in oklab,var(--acc) 35%,transparent)}.wstrip .t small{color:inherit;opacity:.7}.wstrip .red b{color:var(--red)}.wstrip .t.red b{color:inherit}.wstrip .past{opacity:.45}
.dots{display:flex;gap:3px;height:5px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--p)}
/* Month */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 8px}.mnav b{font:500 20px/1.2 var(--serif);text-transform:capitalize}.mnav button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%}.mnav button svg{width:20px;height:20px}
.cwk,.cgr,.dgr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cwk.wkn,.cgr.wkn{grid-template-columns:20px repeat(7,minmax(0,1fr))}
.cwk span{padding:2px 0 8px;text-align:center;font-size:11.5px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.cgr .v,.cwk .v{display:grid;place-items:center;font-size:10.5px;font-weight:500;color:var(--faint);text-transform:none;letter-spacing:0}
.cgr button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;border-radius:12px;min-width:0}
.cgr button b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-weight:500;font-size:15.5px}
.cgr .out{opacity:.3}.cgr .red b{color:var(--red)}.cgr .t b{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}.cgr .s b{background:var(--acc);color:#fff;box-shadow:0 6px 16px color-mix(in oklab,var(--acc) 40%,transparent)}
/* Date picker and time picker */
.dgr button{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:15.5px}.dgr i{aspect-ratio:1}.dgr .t{box-shadow:inset 0 0 0 1.5px var(--ink)}.dgr .s{background:var(--acc);color:#fff}.dgr .red{color:var(--red)}.dgr .s.red{color:var(--card)}
.tpv{margin:6px 0 12px;text-align:center;font:400 44px/1 var(--serif)}
.tgr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:12px}.tgr button{height:42px;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px}.tgr .s{background:var(--acc);color:#fff}
#pk_l{max-height:52vh;overflow-y:auto;margin:10px 0}.pko{display:block;width:100%;padding:12px 14px;border-radius:12px;text-align:left;font-size:16px}.pko.on{background:var(--acc);color:#fff}
/* Sheets */
.sh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:10px;padding-bottom:calc(10px + var(--sab));background:rgba(30,25,22,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.sh.on{opacity:1;pointer-events:auto}.sh.mid{align-items:center}
.box{width:min(100%,460px);max-height:calc(100dvh - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateY(20px);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sh.on .box{transform:none}
.bh{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px 6px 0}.bh b,.title{display:block;font:500 21px/1.25 var(--serif)}
.box .muted{margin:6px 0 4px}
#dp,#tp,#pk,#sc{z-index:56}#modal{z-index:60}
.opt{display:block;width:100%;margin-top:8px;padding:13px 14px;border-radius:14px;background:var(--fill);text-align:left;font-weight:600}.opt small{display:block;margin-top:2px;font-size:13.5px;font-weight:500;color:var(--soft)}.opt.bad{color:var(--bad)}
.box .btn.wide{display:flex;width:100%;margin-top:14px}
/* To do */
.todo{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:50px;border-bottom:1px solid var(--rule)}.todo:last-child{border-bottom:0}
.tchk{display:grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--faint);border-radius:50%;color:transparent;transition:background .2s,border-color .2s}
.tchk svg{width:14px;height:14px;stroke-width:2.6}.tchk.on{background:var(--good);border-color:var(--good);color:#fff}
.tn{width:100%;border:0;background:none;padding:12px 0;font-size:16px;overflow-wrap:anywhere}input.tn:focus{outline:0}
.todo.done .tn{color:var(--soft);text-decoration:line-through}
.x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--faint)}.x svg{width:14px;height:14px;stroke-width:2}.x.arm{background:var(--bad);color:#fff}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.addrow input{height:50px;padding:0 14px;border:1px solid var(--rule);border-radius:14px;background:var(--fill);font-size:16px}.addrow input:focus{outline:0;border-color:var(--acc)}.addrow .btn{width:50px;padding:0}
#t_seg{margin-bottom:6px}
.tdone{margin-top:12px}.tdone summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--soft);padding:8px 0}.tdone summary::-webkit-details-marker{display:none}
/* Us */
.us{text-align:center;padding:24px 18px}
.duo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}.duo>span{display:flex;flex-direction:column;align-items:center;gap:7px}.duo b{font-weight:600;font-size:15px}.duo i.h{font-style:normal;color:var(--acc);font-size:20px;margin-top:-22px}
.ann{margin:14px auto 0;padding-top:14px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--ink);max-width:340px}
.lapp{margin-top:10px;padding:14px 16px;border-radius:16px;background:var(--fill);cursor:pointer}.lapp small{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--soft)}.lapp p{margin:6px 0 0;font:400 18px/1.4 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere}
.inv p{margin:6px 0 0}.inv ol{margin:12px 0 0;padding-left:20px;font-size:14.5px;color:var(--ink)}.inv li{margin-top:6px}.inv .ok{display:flex;align-items:center;gap:10px;font-weight:600}.inv .ok svg{width:20px;height:20px;color:var(--good);stroke-width:2.4}
.menu{padding:4px 18px}.row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;border-bottom:1px solid var(--rule);font-weight:600;text-align:left}.row:last-child{border-bottom:0}.row svg{width:18px;height:18px;color:var(--faint)}
.bdr .et{font-weight:500}
/* Settings */
.set h3{margin-bottom:6px}.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}.srow:last-child{border-bottom:0}.srow>span{font-weight:500}.srow .seg{flex:0 1 220px;min-width:180px}
#c_bkb{display:grid;gap:8px;margin-top:10px}
/* Bottom tabs */
nav{position:fixed;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);z-index:20;display:flex;gap:2px;width:min(calc(100% - 24px),420px);padding:6px;border-radius:22px;background:color-mix(in oklab,var(--card) 92%,transparent);border:1px solid var(--rule);box-shadow:0 10px 30px rgba(43,38,34,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding-top:6px;border-radius:16px;color:var(--soft);font-size:11.5px;font-weight:600}
nav svg{width:22px;height:22px}nav em{font-style:normal}nav button.on{color:var(--ink);background:var(--fill)}
/* Notices */
#toasts{position:fixed;left:50%;top:calc(10px + var(--sat));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(calc(100% - 24px),440px);pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--card);font-size:15px;font-weight:500;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:tin .3s cubic-bezier(.2,1.2,.35,1)}.toast span{flex:1;min-width:0}.toast small{display:block;opacity:.7;font-size:13px}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.tundo{padding:6px 12px;border-radius:99px;background:color-mix(in oklab,var(--card) 18%,transparent);color:inherit;font-weight:700;font-size:14px}
#upd{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);pointer-events:auto;text-align:left}#upd span{flex:1}#upd b{display:block}#upd small{color:var(--soft)}#upd em{font-style:normal;font-weight:650;padding:8px 14px;border-radius:12px;background:var(--ink);color:var(--card)}
html.boot main{opacity:0}main{transition:opacity .4s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fx-glow{box-shadow:0 0 14px 3px color-mix(in oklab,var(--fxc) 45%,transparent)!important}}
@media (hover:hover){.evr:hover b,.row:hover span{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}.cgr button:not(.s):hover,.wstrip button:not(.t):hover,nav button:not(.on):hover{background:var(--fill)}}
/* Wider screens: two columns, tabs on the left. */
@media (min-width:860px){
  body{padding-left:calc(120px + env(safe-area-inset-left,0px));padding-bottom:32px}
  main{max-width:980px}
  .top{left:calc(120px + env(safe-area-inset-left,0px));padding-left:max(10px,calc((100% - 980px)/2 - 6px));padding-right:max(10px,calc((100% - 980px)/2 - 6px))}
  section{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}section>*{grid-column:span 1}
  .hello,#h_next{grid-column:1/-1}
  #k_cal{grid-column:1/-1;max-width:640px;width:100%;justify-self:center}#t_main{grid-column:1/-1;max-width:640px;width:100%;justify-self:center}
  #v_top{grid-column:1/-1}
  nav{left:16px;top:16px;bottom:auto;transform:none;flex-direction:column;width:88px}
  nav button{min-height:66px}
  .big{font-size:56px}
}

/* Icons on days */
.ic{width:20px;height:20px;flex:none}
.dic{display:grid;place-items:center;height:14px;color:var(--dc,var(--acc))}.dic .ic{width:14px;height:14px;stroke-width:2}
.wstrip .t .dic{color:inherit}
.dayic{display:inline-flex;align-items:center;gap:8px;margin:2px 0 6px;padding:7px 12px 7px 9px;border-radius:99px;background:var(--fill);font-size:13.5px;font-weight:600;color:var(--soft)}.dayic .ic{width:16px;height:16px;color:var(--acc)}
h3 .ic{width:18px;height:18px;vertical-align:-3px;color:var(--acc)}
/* Month or day */
.seg.kv{flex:none;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--rule)}.seg.kv button{min-height:32px;padding:0 11px;font-size:13.5px;border-radius:9px}@media (max-width:359px){h1{font-size:21px}.seg.kv button{padding:0 8px}}.seg.kv button.on{background:var(--acc);color:#fff;box-shadow:none}
/* Day view: both of you side by side */
#k_dv{padding:14px 12px 10px}#k_dv .mnav{margin:-6px -4px 6px}#dv_t{display:flex;align-items:center;gap:8px;font:500 18px/1.2 var(--serif);cursor:pointer;text-transform:none}#dv_t .ic{color:var(--acc)}
.dvh,.dvad{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px}
.dvh b{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;padding:10px 6px;border-radius:14px;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden}
.dvh .pa{background:color-mix(in oklab,var(--pa) 20%,var(--card))}.dvh .pb{background:color-mix(in oklab,var(--pb) 20%,var(--card))}
.dvad{margin-top:8px}.dvad>div{display:flex;flex-direction:column;gap:4px;min-width:0}.dvfull{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-left:50px}
.dvfull .hol{font-size:13px;font-weight:600;color:var(--soft);padding:5px 0}.dvfull .hol.red{color:var(--red)}
.dvall{display:flex;align-items:center;gap:6px;min-width:0;padding:6px 10px;border-radius:12px;background:color-mix(in oklab,var(--c) 30%,var(--card));font-size:13px;font-weight:600;text-align:left}.dvall span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dvall .ic{width:15px;height:15px}
#dv_body{position:relative;max-height:max(240px,calc(100dvh - 372px - var(--sat) - var(--sab)));padding-bottom:10px;overflow-y:auto;margin-top:10px;border-radius:12px;overscroll-behavior:contain}
.dvb{position:relative;display:grid;grid-template-columns:44px 1fr 1fr;gap:6px}
.dvg{position:absolute;inset:0;pointer-events:none}.dvg i{position:absolute;left:44px;right:0;border-top:1px solid var(--rule);font-style:normal}.dvg s{position:absolute;left:-44px;top:-8px;width:38px;text-align:right;text-decoration:none;font-size:11px;font-weight:600;color:var(--faint)}
.dvcol{grid-column:2;position:relative;height:100%;border-radius:12px;cursor:copy}.dvcol.pb{grid-column:3}
.dvcol.pa{background:color-mix(in oklab,var(--pa) 5%,transparent)}.dvcol.pb{background:color-mix(in oklab,var(--pb) 5%,transparent)}
.dvev{position:absolute;display:flex;align-items:flex-start;gap:6px;padding:7px 8px;border-radius:12px;text-align:left;cursor:pointer}
.dvev span{min-width:0;overflow:hidden}.dvev b{display:block;font-size:13px;font-weight:650;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dvev small{display:block;font-size:11.5px;color:color-mix(in oklab,var(--ink) 60%,transparent);font-weight:600;margin-top:2px}.dvev .ic{width:15px;height:15px;margin-top:1px}
.dvev.fill{background:color-mix(in oklab,var(--c) 42%,var(--card))}
.dvev.both.fill{background:color-mix(in oklab,var(--c) 26%,var(--card));border-top:3px solid var(--c)}
.dvb .nowl{position:absolute;left:44px;right:0;z-index:3;height:2px;background:var(--acc);border-radius:2px;font-style:normal;pointer-events:none}.dvb .nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
/* Look of an event: style, colour, icon */
/* The look of an event is folded away behind its preview, so the Add button is never far. */
.lookrow{display:flex;align-items:center;gap:10px;cursor:pointer}.lookrow .pv{flex:1;min-width:0;margin-top:0}.lookrow>span{flex:none;font-size:14.5px;font-weight:600;color:var(--acc)}
#es_look{margin-top:10px;padding:12px;border-radius:16px;background:var(--fill)}#es_look .fl:first-child{margin-top:0}#es_look .sw{margin-top:6px}#es_look .ics button{background:var(--card)}#es_look .ics button.on{background:var(--acc)}
.acts.stick{position:sticky;bottom:-20px;z-index:2;margin:14px -20px -20px;padding:12px 20px 20px;background:linear-gradient(to bottom,transparent,var(--card) 14px)}
#es_by{font-size:13px;text-align:center;margin-top:16px}
.nudge{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,color-mix(in oklab,var(--acc) 14%,var(--card)),color-mix(in oklab,var(--pg) 14%,var(--card)))}.nudge p{margin:0}.nudge .row2{display:flex;align-items:center;gap:14px}.nudge .btn{flex:1}
.tempty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 8px 18px;text-align:center}.tempty svg{width:44px;height:44px;color:var(--acc);opacity:.8}.tempty b{font:500 19px/1.3 var(--serif)}.tempty p{margin:0;font-size:14.5px;color:var(--soft)}.tempty .chips{justify-content:center;margin-top:10px}
.adl{align-self:center;font-size:10.5px;font-weight:600;color:var(--soft);text-align:right;padding-right:2px}.dvhint{text-align:center;margin:10px 0 0}
.pv{margin-top:10px}.pv .evr{margin:0;pointer-events:none}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.swt{position:relative;width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.swt.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.swt.auto{background:conic-gradient(var(--pa) 0 50%,var(--pb) 0)}.swt.auto.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--soft)}
.swt.cust{background:conic-gradient(#f2928a,#f3d679,#7dd6b0,#82c3f5,#a996f7,#f5a3c7,#f2928a);cursor:pointer;overflow:hidden}.swt.cust.on{background:var(--c);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.swt.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.ics{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ics button{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--fill);color:var(--ink)}.ics button.on{background:var(--acc);color:#fff}.ics .ic,.ics svg{width:20px;height:20px}
.ics.big{flex-wrap:wrap;overflow:visible;justify-content:center;margin:14px 0 4px}.ics.big button{width:48px;height:48px;border-radius:14px}
@media (min-width:860px){#k_dv{grid-column:1/-1}.seg.kv{grid-column:1/-1;justify-self:center}#dv_body{max-height:max(280px,calc(100dvh - 270px))}}

/* ---------- Effects around a day (and its events in day view) ---------- */
@property --fxa{syntax:"<angle>";initial-value:0deg;inherits:false}
.fx{position:relative;--fxc:var(--acc)}
.fx::before,.fx::after{content:"";position:absolute;pointer-events:none;z-index:1}
/* Glow: a soft light that breathes */
.fx-glow{animation:fxglow 2.6s ease-in-out infinite}
@keyframes fxglow{0%,100%{box-shadow:0 0 8px 1px color-mix(in oklab,var(--fxc) 40%,transparent)}50%{box-shadow:0 0 0 3px color-mix(in oklab,var(--fxc) 20%,transparent),0 0 22px 6px color-mix(in oklab,var(--fxc) 55%,transparent)}}
/* Rainbow: a turning ring of colour */
.fx-rainbow{box-shadow:0 0 14px 2px color-mix(in oklab,#a996f7 35%,transparent),0 0 10px 1px color-mix(in oklab,#f5a3c7 30%,transparent)}
.fx-rainbow::before{inset:-3.5px;border-radius:inherit;background:conic-gradient(from var(--fxa),#f5a3c7,#f3d679,#7dd6b0,#82c3f5,#a996f7,#f5a3c7);animation:fxspin 3.2s linear infinite}
.fx-rainbow::before{padding:2.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@keyframes fxspin{to{--fxa:360deg}}
/* Sparkle: little stars that twinkle around it */
.fx-sparkle{--fxc:#f0bf3c;box-shadow:0 0 12px 1px color-mix(in oklab,var(--fxc) 35%,transparent)}
.fx-sparkle::before,.fx-sparkle::after{inset:-10px;background:radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.2px) 6% 10%/9px 9px no-repeat,radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.4px) 96% 18%/11px 11px no-repeat,radial-gradient(circle,#fff 0 .8px,var(--fxc) 1.4px,transparent 2.8px) 88% 96%/8px 8px no-repeat,radial-gradient(circle,#fff 0 1px,var(--fxc) 1.6px,transparent 3.2px) 4% 86%/10px 10px no-repeat;animation:fxtw 1.9s ease-in-out infinite}
.fx-sparkle::after{background-position:50% 0%,100% 62%,45% 100%,0% 42%;animation-delay:.95s}
@keyframes fxtw{0%,100%{opacity:0;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
/* Hearts: small hearts floating up */
.fx-hearts{--fxc:#f08bb0;box-shadow:0 0 12px 1px color-mix(in oklab,var(--fxc) 35%,transparent)}
.fx-hearts::before,.fx-hearts::after{content:"♥";top:-7px;right:-6px;color:var(--fxc);font:12px/1 var(--ui);opacity:.9;animation:fxheart 2.6s ease-in infinite}
.fx-hearts::after{right:auto;left:-6px;top:35%;font-size:9px;animation-delay:1.3s}
@keyframes fxheart{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.15) rotate(-12deg)}}
.cgr b.fx{z-index:1}.dvev.fx{z-index:2}
/* Choosing an effect */
.fxs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.fxs button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 8px;border-radius:14px;min-width:0}
.fxs button.on{background:color-mix(in oklab,var(--acc) 12%,var(--fill))}.fxs small{font-size:12px;font-weight:600;color:var(--soft)}.fxs button.on small{color:var(--acc)}
.fxd{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--rule);font-weight:600;font-size:15px}

/* Side menu */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(30,22,40,.35);opacity:0;pointer-events:none;transition:opacity .25s}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:45;display:flex;flex-direction:column;width:min(300px,84vw);padding:calc(18px + var(--sat)) 14px calc(18px + var(--sab));background:var(--card);border-radius:0 26px 26px 0;box-shadow:0 20px 60px rgba(40,20,60,.2);transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);overflow-y:auto}
#drawer.on{transform:none}
.dbrand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}.dbrand img{width:44px;height:44px;border-radius:12px}.dbrand b{display:block;font:500 21px/1.1 var(--serif)}.dbrand small{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.dsec{margin:14px 10px 6px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
#drawer>button.di{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 12px;border-radius:14px;font-weight:600;text-align:left}
#drawer>button.di svg{width:21px;height:21px;color:var(--acc)}#drawer>button.di.on{background:color-mix(in oklab,var(--acc) 12%,var(--fill))}
@media (hover:hover){#drawer>button.di:hover{background:var(--fill)}}
.dlang{display:flex;gap:10px;margin:10px 12px 0}.dlang button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1;background:var(--fill);border:2px solid transparent;opacity:.55;transition:opacity .2s,border-color .2s}.dlang button.on{opacity:1;border-color:var(--acc)}

/* Weekdays for a weekly repeat */
.wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.wds button{height:40px;border-radius:12px;background:var(--fill);font-size:13px;font-weight:650;color:var(--soft)}.wds button.on{background:var(--acc);color:#fff}.wds button.base{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--acc)}
#ds .box{min-height:38vh}#ds .bh b{display:flex;align-items:center;gap:8px}#ds .bh .ic{color:var(--acc)}
#k_now{margin-top:6px}
.ei.fx{overflow:visible}

/* Month: taller days with the events written out */
.cgr{gap:3px 2px}
.cgr button{position:relative;justify-content:flex-start;min-height:96px;padding:4px 0 5px;gap:3px;overflow:visible}
.cgr button b{width:28px;height:28px;font-size:14.5px;flex:none}
.cgr .dic{position:absolute;top:3px;right:1px;height:auto}.cgr .dic .ic{width:11px;height:11px}
.cev{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 1px;min-width:0}
/* Event names in a month cell: readable size, and a long name fades out instead of being chopped. */
.cev u{--bg:color-mix(in oklab,var(--c) 38%,var(--card));position:relative;display:block;text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;padding:2px 0 2px 4px;border-radius:6px;background:var(--bg);color:var(--ink);white-space:nowrap;overflow:hidden;text-align:left}
.cev u::after{content:"";position:absolute;top:0;right:0;bottom:0;width:9px;background:linear-gradient(90deg,transparent,var(--bg) 85%)}
.cev u.gl{--bg:color-mix(in oklab,var(--c) 14%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 60%,transparent)}
.cev em{font-style:normal;font-size:10.5px;font-weight:650;color:var(--soft);text-align:left;padding-left:3px;line-height:1.2}
.cgr .v{place-items:start center;padding-top:11px}
.cgr .s{background:color-mix(in oklab,var(--acc) 9%,transparent)}
@media (min-width:560px){.cgr button{min-height:108px}.cev u{font-size:11.5px;padding:2px 5px}.cev em{font-size:11px}}
@media (min-width:860px){#k_cal{max-width:none}.cgr button{min-height:124px}.cev u{font-size:12.5px;text-overflow:ellipsis}}

#drawer>button.dset{margin-top:auto;border-top:1px solid var(--rule);border-radius:0 0 14px 14px;padding-top:4px}
.dbrand{padding:6px 12px 18px}

/* Phones: the month runs almost edge to edge so each day is as wide as possible. */
@media (max-width:559px){#k_cal{margin:0 -12px;padding:14px 4px 10px;border-radius:22px}#k_cal .mnav{padding:0 10px}.cwk.wkn,.cgr.wkn{grid-template-columns:15px repeat(7,minmax(0,1fr))}.cgr{gap:3px 1px}.cgr .v{font-size:9.5px}}
/* Sheets keep clear of the status bar at the top. */
.sh{padding-top:calc(28px + var(--sat))}.box{max-height:calc(100dvh - 38px - var(--sat) - var(--sab))}
/* Room above the first hour so its time label is not cut off. */
.dvb{margin-top:10px}

/* Background: a faint mist in the app's own soft tones that drifts slowly behind everything. */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky i{--k:color-mix(in oklab,var(--acc) 16%,var(--card));position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--k) 0,color-mix(in oklab,var(--k) 60%,transparent) 45%,transparent 100%);opacity:.75;will-change:transform;animation:drift var(--t) ease-in-out infinite alternate}
.sky i:nth-child(1){--t:34s;width:120vmax;height:60vmax;left:-50vmax;top:-22vmax;--x:30vmax;--y:6vmax;--s:1.1}
.sky i:nth-child(2){--k:var(--card);--t:41s;width:110vmax;height:52vmax;right:-55vmax;top:14vmax;--x:-34vmax;--y:8vmax;--s:1.15}

<script>
const $=id=>document.getElementById(id);
/* Settings follow the shared "plan" record, except the theme, which each phone keeps for itself. */
const S={lang:"sv",theme:"auto",wkno:true,hol:true};
let NOW=new Date(),col=null,tab="h",allIds=[];
const LOCAL=!!window.KK_LOCAL;
/* Shared between the two of you: the Claude version always, the installed version when Firebase is reachable. */
const SHARED=()=>!LOCAL||!!(window.KK&&KK.mode==="cloud");
/* The shared version of the app, for inviting each other. */
const ART_URL="https://claude.ai/artifact/8vDeWGtrcxYDKvrjkKX1cj";
const MNS=[["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"],["January","February","March","April","May","June","July","August","September","October","November","December"]];
const DSH=[["Mån","Tis","Ons","Tor","Fre","Lör","Sön"],["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]];
const li=()=>S.lang==="sv"?0:1,mn=i=>MNS[li()][i],loc=()=>S.lang==="sv"?"sv-SE":"en-GB",tx=(a,b)=>li()?b:a,dshort=i=>DSH[li()][i];
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const T={nH:["Idag","Today"],nK:["Kalender","Calendar"],nT:["Att göra","To do"],nV:["Vi","Us"],ttlH:["Idag","Today"],ttlK:["Kalender","Calendar"],ttlT:["Att göra","To do"],ttlV:["Vi två","The two of us"],ttlC:["Inställningar","Settings"],ttlO:["Om Kalenderkoll","About Kalenderkoll"]};
const t=k=>T[k][li()];

/* The two of you: a and b, and g for things you do together. ua/ub tie a name to a signed-in person. */
let CP={a:"",b:"",ua:"",ub:"",since:"",ca:"",cb:""},ME="",MYID="";
try{const m=localStorage.getItem("kalenderkoll.me");if(m==="a"||m==="b")ME=m}catch(e){}
const other=w=>w==="a"?"b":"a",me=()=>ME||"a";
const pname=w=>w==="g"?tx("Båda","Both"):(CP[w]||(w==="a"?tx("Du","You"):tx("Din partner","Your partner")));
const initial=w=>(pname(w).trim()[0]||"?").toUpperCase();
const pvar=w=>w==="a"?"var(--pa)":w==="b"?"var(--pb)":"var(--pg)";
/* Profile pictures (small, saved with the calendar) and each person's own colour. */
let PICS={a:"",b:""};

  evs.forEach(e=>{const last=e.e||e.d;L.push("BEGIN:VEVENT","UID:"+e.id+"@kalenderkoll","DTSTAMP:"+stamp,"SUMMARY:"+icsEsc(e.n));
    if(e.t)L.push("DTSTART:"+icsDT(e.d,e.t),"DTEND:"+icsDT(last,e.t2&&(e.e||tmin(e.t2)>tmin(e.t))?e.t2:addMin(e.t,60)));else L.push("DTSTART;VALUE=DATE:"+icsD(e.d),"DTEND;VALUE=DATE:"+icsD(nd(dn(last)+1)));

    if(e.pl)L.push("LOCATION:"+icsEsc(e.pl));if(e.o)L.push("DESCRIPTION:"+icsEsc(e.o));L.push("END:VEVENT")});
