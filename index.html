<style>
/* Glass panels floating over a live liquid map of your week. One idea per panel. */

/* Phone: one column with a floating tab bar. Tablet (700+): two-column panels. Laptop (1024+): side rail. Wide (1280+): three-column budget. */
.big.verdict{font-size:38px}
.sheet>.head{margin-bottom:10px}
.mnavw{min-width:0}
nav .more{display:none}
.note,.find p{max-width:68ch}
@media (hover:hover){.btn:hover,.links a:hover{opacity:.88}nav button:not(.on):hover,#drawer>button:not(.on):hover,.mnav button:hover,#yr_list button:not(.on):hover{background:var(--rule);color:var(--ink)}.lnk:hover{text-decoration:underline}}

}
@media (min-width:1280px){
}

/* Budget lines as soft tiles, with a calm red remove button. */
.lnw{background:var(--glass2);border:1px solid var(--rule);border-radius:14px;padding:6px 8px 6px 14px;margin-top:7px;transition:border-color .2s,box-shadow .2s}
.lnw:focus-within{border-color:var(--pen);box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 16%,transparent)}
.ln{grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;border-bottom:0}
.ln input:focus{box-shadow:none}
.amw{display:flex;align-items:baseline;gap:5px}.ln .am{width:5.4em;font-size:17px}.amw span{font-size:14px;color:var(--soft)}
.x{width:32px;height:32px;border:0;border-radius:11px;background:transparent;color:var(--soft);display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.x{transition:background .15s,color .15s,transform .12s}.x:active{background:var(--rule);transform:scale(.86)}.x.arm:active{background:var(--bad);transform:scale(.86)}
.x.arm{background:var(--bad);color:#fff;animation:arm .22s ease-out}.x.arm svg{stroke-width:2.4}
@keyframes arm{40%{transform:scale(1.12)}}
.x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.spst{border-bottom:0;border-top:1px solid var(--rule);min-height:46px;padding-right:2px}
.sub2{display:block;font-size:13px;color:var(--soft);font-weight:500}
@media (hover:hover){.x:not(.arm):hover{background:var(--rule);color:var(--ink)}}
/* The year summary on Overview. */
.yhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ynav{display:flex;gap:4px}.ynav button{width:40px;height:40px;border:0;border-radius:12px;background:var(--rule);font-size:20px;padding:0}

.ytable th.cur{color:var(--ink)}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.ybars{height:190px}.tile b{font-size:28px}}

/* Repeating lines: a small chip under each line, opens the schedule sheet. */
.freq{display:block;border:0;background:none;padding:0 0 8px;margin-top:-6px;color:var(--soft);font-size:13px;font-weight:600;text-align:left}
.freq.on{color:var(--pen)}

#rs.on{opacity:1;pointer-events:auto}
#rs .mbox b{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}

.evr.bdr>i svg,.evr.hol>i svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.evr.bdr .en,.evr.hol .en{padding-left:14px}
.evr.hol>i{background:color-mix(in srgb,var(--soft) 14%,transparent);color:var(--soft)}.evr.hol.red>i{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.evr.hol.red .en b{color:var(--bad)}
.evr.cdr .et b{display:block;font:700 26px/1 var(--hand);letter-spacing:-.02em}.evr.cdr .et small{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-top:2px}
@media (hover:hover){button.evr:hover .en b{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 30%,transparent);text-underline-offset:3px}}
/* This week, as seven small days. */
.hday{text-transform:none}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:8px 0 7px;border:1px solid transparent;border-radius:14px;background:none;color:var(--ink)}
.wstrip small{font-size:12px;font-weight:650;color:var(--soft);text-transform:uppercase;letter-spacing:.03em}.wstrip b{font:650 20px/1.1 var(--hand)}
.wstrip .red b,.wstrip .red small{color:var(--bad)}.wstrip .past{opacity:.6}
.wstrip .t{background:var(--ink);color:var(--paper)}.wstrip .t small,.wstrip .t.red b,.wstrip .t.red small{color:inherit;opacity:.85}
.dots{display:flex;gap:3px;height:6px;margin-top:2px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--k)}
.wstrip .t .dots i{box-shadow:0 0 0 1.5px var(--paper)}
@media (hover:hover){.wstrip button:not(.t):hover{background:var(--rule)}}
/* The month. */
.cwk,.cgr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
#k_cal.wn .cwk,#k_cal.wn .cgr{grid-template-columns:22px repeat(7,minmax(0,1fr))}
.cwk span{text-align:center;font-size:12.5px;font-weight:650;color:var(--soft);padding-block:2px 8px;text-transform:uppercase;letter-spacing:.03em}.cwk .red{color:var(--bad)}
.cgr .v,.cwk .v{display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--soft);opacity:.75;text-transform:none;letter-spacing:0}
.cgr button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-width:0;aspect-ratio:1/1.08;padding:7px 0 4px;border:0;border-radius:13px;background:none;color:var(--ink);overflow:hidden}
.cgr button>b{display:grid;place-items:center;width:32px;height:32px;margin-top:-3px;border-radius:50%;font:600 16.5px/1 var(--ui)}
.cgr button.red>b{color:var(--bad)}.cgr button.out{opacity:.38}.cgr button.past>b{opacity:.7}
.cgr button.t>b{box-shadow:inset 0 0 0 1.5px var(--pen);color:var(--pen);opacity:1}
.cgr button.s{background:color-mix(in srgb,var(--pen) 12%,transparent)}.cgr button.s>b{background:var(--ink);color:var(--paper);box-shadow:none;opacity:1}
.cd{display:flex;gap:3px;align-items:center;height:7px}.cd i{width:6px;height:6px;border-radius:50%;background:var(--k)}.cd em{font-style:normal;font-size:11px;font-weight:700;line-height:6px;color:var(--soft)}
.ct{display:none}
@media (hover:hover){.cgr button:not(.s):hover{background:var(--rule)}}
#k_day .phead{margin-bottom:4px}
/* Agenda */
.srch{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:1px solid var(--rule);border-radius:14px;background:var(--glass2)}
.srch:focus-within{border-color:var(--pen);box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 16%,transparent)}
.srch svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--soft);stroke-width:2;stroke-linecap:round}
.srch input{flex:1;height:100%;border:0;background:none;font-size:16px;outline:0;padding:0}
#a_rng{margin-top:12px}
.amon{margin:22px 0 4px;font:650 19px/1.2 var(--hand);letter-spacing:-.01em}.amon:first-child{margin-top:0}
.aday{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding-top:4px;border-top:1px solid var(--rule)}
.amon+.aday{border-top:0}
.adh{display:flex;flex-direction:column;align-items:center;align-self:start;margin-top:8px;padding:6px 0;border:0;border-radius:12px;background:none;color:var(--ink)}
.adh b{font:650 21px/1 var(--hand)}.adh small{font-size:12px;font-weight:650;color:var(--soft);text-transform:uppercase;margin-top:2px}
.aday.t .adh{background:var(--ink);color:var(--paper)}.aday.t .adh small{color:inherit;opacity:.8}
.aday .evr{padding-block:10px}
/* Countdown */
.cdbar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:14px}.cdbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--f1),var(--f2));transition:width .6s}
.row small.rs{display:block;font-size:13.5px;color:var(--soft);margin-top:1px}
#d_hl .row b,#x_kd .row b{font-size:15px}
/* Holidays */
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
#x_tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile small{font-size:13px;color:var(--soft)}
.xrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:9px;border-bottom:1px solid var(--rule)}.xrow:last-child{border:0}
.xd{display:flex;flex-direction:column;align-items:center;padding:5px 0;border-radius:12px;background:var(--glass2);border:1px solid var(--rule)}.xd b{font:650 19px/1 var(--hand)}.xd small{font-size:11.5px;font-weight:650;color:var(--soft);text-transform:uppercase;margin-top:2px}
.xrow.red .xd{border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}.xrow.red .xd small{color:inherit}
.xrow>span:nth-child(2) b{display:block;font-weight:650}.xrow>span:nth-child(2) small{font-size:13.5px;color:var(--soft)}
.xrow em{font-style:normal;font-size:13.5px;font-weight:600;color:var(--soft);white-space:nowrap}.xrow.past{opacity:.5}
/* Sheets that slide up from the bottom. */
.bsh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(5,10,20,.55);opacity:0;pointer-events:none;transition:opacity .2s}.bsh.on{opacity:1;pointer-events:auto}
.bsh .mbox{max-height:calc(100dvh / var(--z,1) - 24px);overflow-y:auto;overscroll-behavior:contain;transform:translateY(24px);transition:transform .3s cubic-bezier(.2,.9,.3,1)}.bsh.on .mbox{transform:none}.bsh .mbox>b{display:block}
#dp,#tp,#pk,#sc{z-index:56}
#es .mbox{width:min(100%,460px)}
.bsh input[type=text],.bsh input:not([type]),.bsh textarea{width:100%;height:48px;padding:0 12px;border:1px solid var(--rule);border-radius:12px;background:none;margin-top:6px;font-size:16px}
.bsh textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.4;font:inherit;color:var(--ink)}
.bsh label{display:block;font-size:14px;color:var(--soft);margin-top:14px;font-weight:600}
.bsh .chips{margin:8px 0 0}.bsh .help{margin-top:2px}
.dbtn span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}.esg.one{grid-template-columns:1fr}
.tpair{display:flex;align-items:center;gap:6px;margin-top:6px}.tpair i{font-style:normal;color:var(--soft)}
.tbtn{flex:1;min-width:0;height:48px;border:1px solid var(--rule);border-radius:12px;background:none;color:var(--ink);font:600 17px/1 var(--ui);font-variant-numeric:tabular-nums}.tbtn.empty{color:var(--soft);font-weight:500;font-size:15px}
.chip>i{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:var(--k)}
.chips.cats .chip.on{background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--ink);border-color:var(--k)}
.seg.three{grid-template-columns:repeat(3,1fr)}.seg button{padding:0 6px}
.bsd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}
.tpv{margin:6px 0 10px;text-align:center;font:700 44px/1.1 var(--hand);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tgr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:6px 0 12px}
.tgr button{height:42px;border:1px solid var(--rule);border-radius:11px;background:none;color:var(--ink);font:600 15.5px/1 var(--ui);font-variant-numeric:tabular-nums}
.tgr button.s{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (hover:hover){.tgr button:not(.s):hover{background:var(--rule)}}
#pk_l{max-height:min(56vh,480px)}
.dgr button.red{color:var(--bad)}.dgr button.s.red{color:var(--paper)}
.icsb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#c_bk{margin-bottom:8px}
.toast.rem i{--c:var(--pen)}
#h_main .big.verdict,#d_top .big{overflow-wrap:anywhere}
/* Tablet and laptop: the month gets room for names, panels sit side by side. */
@media (min-width:700px){
  #h_main{grid-column:span 7}#h_wk{grid-column:span 5;align-self:stretch;display:flex;flex-direction:column}#h_wk .wstrip{flex:1;align-items:center}
  #h_today{grid-column:span 7;align-self:start}#h_next{grid-column:span 5;grid-row:span 2;align-self:start}#h_bd{grid-column:span 7;align-self:start}
  #k_cal .ct{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 4px;min-width:0}
  #k_cal .cd{display:none}
  .cgr button{aspect-ratio:auto;min-height:96px;align-items:stretch;padding:5px 0 4px}
  .cgr button>b{align-self:flex-start;margin:0 0 0 4px;width:28px;height:28px;font-size:15px}
  .ct u{display:block;text-decoration:none;font-size:12px;font-weight:600;line-height:1.25;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--k) 18%,transparent);border-left:3px solid var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .ct u.cont{border-left-color:transparent}.ct u s{text-decoration:none;opacity:.75;font-weight:650}
  .ct u.hl{background:none;border:0;color:var(--bad);padding-inline:2px}
  .cgr .v{place-items:start center;padding-top:12px}
  .ct em{font-style:normal;font-size:11.5px;font-weight:650;color:var(--soft);text-align:left;padding-left:4px}
  #a_top{grid-column:span 12}
  #f_top{grid-column:span 5;align-self:start}#f_main{grid-column:span 7}
  #d_top{grid-column:span 7;align-self:start}#d_main{grid-column:span 5;grid-row:span 2}#d_hol{grid-column:span 7;align-self:start}
  #x_top{grid-column:span 5;align-self:start}#x_main{grid-column:span 7;grid-row:span 2}#x_kl{grid-column:span 5;align-self:start}
  #c>:nth-child(1),#c>:nth-child(2),#c>:nth-child(3),#c>:nth-child(4){grid-column:span 6;align-self:start}#c>:nth-child(5){grid-column:span 12}
  .esg{gap:12px}
}
@media (min-width:1024px){
  #k_per{grid-column:1/span 8;grid-row:1}#k_cal{grid-column:1/span 8;grid-row:2}#k_day{grid-column:9/span 4;grid-row:1/span 2;align-self:start;position:sticky;top:96px}
  .cgr button{min-height:104px}
}

  const L=[[dnOf(y,0,1),"Nyårsdagen","New Year's Day",1],[dnOf(y,0,5),"Trettondagsafton","Twelfth Night",0],[dnOf(y,0,6),"Trettondedag jul","Epiphany",1],[E-2,"Långfredagen","Good Friday",1],[E-1,"Påskafton","Easter Eve",0],[E,"Påskdagen","Easter Sunday",1],[E+1,"Annandag påsk","Easter Monday",1],[dnOf(y,3,30),"Valborgsmässoafton","Walpurgis Night",0],[dnOf(y,4,1),"Första maj","May Day",1],[E+39,"Kristi himmelsfärdsdag","Ascension Day",1],[E+49,"Pingstdagen","Whit Sunday",1],[dnOf(y,5,6),"Sveriges nationaldag","National Day of Sweden",1],[fri(5,19),"Midsommarafton","Midsummer Eve",0],[sat(5,20),"Midsommardagen","Midsummer Day",1],[sat(9,31),"Alla helgons dag","All Saints' Day",1],[dnOf(y,11,24),"Julafton","Christmas Eve",0],[dnOf(y,11,25),"Juldagen","Christmas Day",1],[dnOf(y,11,26),"Annandag jul","Boxing Day",1],[dnOf(y,11,31),"Nyårsafton","New Year's Eve",0]];

/* ---------- Agenda: everything coming up, grouped by day, with search ---------- */

  const span=q?Math.max(AG.lim,366):AG.lim,A=AG.past?n-span:n,B=AG.past?n-1:n+span,L=between(A,B).filter(o=>hit(o.e)),days=new Map(),add=(d,h)=>{if(!days.has(d))days.set(d,[]);days.get(d).push(h)};
  L.forEach(o=>{const d=Math.max(o.s,A);add(d,evRow(o,o.end>o.s?null:d,{nopast:AG.past}))});
  BD.filter(b=>!q||b.n.toLowerCase().includes(q)).forEach(b=>{const[y]=ymd(A);for(let k=y;k<=ymd(B)[0];k++){const s=bdOnYear(b,k);if(s>=A&&s<=B)add(s,bdRow(b,s))}});
  if(S.hol&&!q)for(let y=ymd(A)[0];y<=ymd(B)[0];y++)holidays(y).forEach(h=>{if(h[0]>=A&&h[0]<=B)add(h[0],holRow(h))});
  const keys=[...days.keys()].sort((a,b)=>AG.past?b-a:a-b);let lastM=-1;
  $("a_list").innerHTML=keys.length?keys.map(d=>{const[y,m]=ymd(d),mk=y*12+m,mh=mk!==lastM?`<div class="amon">${mn(m)} ${y!==NOW.getFullYear()?y:""}</div>`:"";lastM=mk;
    const hol=days.get(d).filter(x=>x.includes("evr hol")),rest=days.get(d).filter(x=>!x.includes("evr hol"));
    return mh+`<div class="aday${d===n?" t":""}"><button class="adh" data-gday="${d}"><b>${ymd(d)[2]}</b><small>${dshort(wdOf(d))}</small></button><div>${hol.join("")+rest.join("")}</div></div>`}).join("")
    :`<p class="note" style="margin-top:2px">${q?tx("Inget hittades.","Nothing found."):AG.past?tx("Inget de senaste månaderna.","Nothing in the past months."):tx("Inget inplanerat. Tryck Ny för att lägga till.","Nothing planned. Tap New to add something.")}</p>`;
  $("a_more").classList.toggle("hide",!!q||AG.lim>=730);$("a_more").textContent=AG.past?tx("Visa längre bak","Show further back"):tx("Visa längre fram","Show further ahead")}

/* ---------- Nedräkning: events marked to count down to ---------- */
function renderCountdown(){const n=todayN(),now=Date.now(),L=[];EV.filter(e=>e.cd).forEach(e=>{const o=occ(e,n-1,n+3650).map(s=>({e,s,end:s+evDur(e)})).find(x=>endMs(x)>now);if(o)L.push(o)});L.sort(byTime);

  else{const d=f.s-n,ms=startMs(f)-now;$("d_lbl").textContent=f.e.n;
    $("d_big").textContent=d>0?tx(`${d} ${d===1?"dag":"dagar"}`,`${d} ${d===1?"day":"days"}`):ms>0&&f.e.t?tx(`${Math.floor(ms/36e5)} tim ${Math.floor(ms%36e5/6e4)} min`,`${Math.floor(ms/36e5)} h ${Math.floor(ms%36e5/6e4)} min`):tx("Nu!","Now!");

    const made=+((/^[a-z0-9]{8,}$/.test(f.e.id)&&parseInt(f.e.id.slice(0,8),36))||0),from=made>1e12&&made<startMs(f)?made:startMs(f)-100*864e5,p=Math.max(0,Math.min(1,(now-from)/(startMs(f)-from)));
    bar.classList.remove("hide");bar.firstElementChild.style.width=(p*100).toFixed(1)+"%"}
  $("d_head").textContent=tx("Dina nedräkningar","Your countdowns");$("d_add").textContent=tx("Ny nedräkning","New countdown");$("d_note").textContent=tx("Alla händelser kan visas här. Slå på Nedräkning när du lägger till eller ändrar en händelse.","Any event can show here. Turn on Countdown when you add or change an event.");
  $("d_list").innerHTML=L.length?L.map(o=>{const d=o.s-n;return `<button class="evr cdr" data-ev="${esc(o.e.id)}" data-on="${nd(o.s)}" style="--k:${catVar(o.e.c)}"><i></i><span class="en"><b>${esc(o.e.n)}</b><small>${cap(fmtD(o.s,{weekday:"short",day:"numeric",month:"short",year:ymd(o.s)[0]!==NOW.getFullYear()?"numeric":undefined}))}${o.e.t?" "+o.e.t:""}</small></span><span class="et"><b>${d<=0?tx("Nu","Now"):d}</b>${d>0?`<small>${d===1?tx("dag","day"):tx("dagar","days")}</small>`:""}</span></button>`}).join(""):`<p class="note" style="margin-top:0">${tx("Inga nedräkningar ännu.","No countdowns yet.")}</p>`;
  const H2=[];for(let y=ymd(n)[0];y<=ymd(n)[0]+1&&H2.length<3;y++)holidays(y).forEach(h=>{if(h[0]>=n&&H2.length<3&&(h[3]||EVES.includes(h[1])))H2.push(h)});
  $("d_hol").classList.toggle("hide",!S.hol);$("d_hh").textContent=tx("Lediga dagar som närmar sig","Days off coming up");$("d_hg").textContent=tx("Alla helgdagar →","All holidays →");
  $("d_hl").innerHTML=H2.map(h=>`<div class="row"><span>${esc(h[1+li()])}<small class="rs">${cap(fmtD(h[0],{weekday:"long",day:"numeric",month:"long"}))}</small></span><b>${esc(inDays(h[0]-n))}</b></div>`).join("")}
