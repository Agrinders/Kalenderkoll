# Builds the Android app (an .apk file) every time main changes.
# The app opens the website, so changes pushed to GitHub show up without reinstalling (like a PWABuilder app).
# The newest file is always at: https://github.com/Agrinders/Kalenderkoll/releases/download/android/Kalenderkoll.apk
name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app into www
        run: |
          python3 build.py
          mkdir -p www/icons
          cp index.html app-shell.js manifest.webmanifest version.json www/
          cp icons/*.png www/icons/
          # Inside the app the files are already on the phone, so no offline helper is needed.
          sed -i 's#navigator.serviceWorker.register("sw.js")#0#' www/index.html
      - name: Make the Android project
        run: |
          mkdir -p app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/local-notifications@8 @capacitor/filesystem@8 @capacitor/assets@4
          cp -r ../www ./www
          cat > capacitor.config.json <<'JSON'
          {"appId":"se.agrinders.kalenderkoll","appName":"Kalenderkoll","webDir":"www","server":{"url":"https://agrinders.github.io/Kalenderkoll/"},"android":{"backgroundColor":"#f8f3f4"}}
          JSON
          npx cap add android
          mkdir -p assets && cp ../android-assets/*.png assets/
          npx capacitor-assets generate --android --iconBackgroundColor '#f3b8c6' --splashBackgroundColor '#f8f3f4' --splashBackgroundColorDark '#15131a'
          npx cap sync android
          # Older phones (Android 10 and earlier) need permission to write the backup to Documents.
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE android/app/src/main/AndroidManifest.xml
          # The home-screen widget: its code, its looks, and its entry in the app's manifest.
          cp ../android-native/java/*.java android/app/src/main/java/se/agrinders/kalenderkoll/
          cp -r ../android-native/res/. android/app/src/main/res/
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('android/app/src/main/AndroidManifest.xml');s=p.read_text()
          r='''        <receiver android:name=".WidgetProvider" android:exported="true" android:label="@string/kk_widget_name">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/kk_widget_info" />
                  </receiver>
              </application>'''
          assert '</application>' in s
          p.write_text(s.replace('</application>',r,1))
          PY
          ls android/app/src/main/java/se/agrinders/kalenderkoll/
          # The background check uses Android's WorkManager.
          sed -i 's/^dependencies {/dependencies {\n    implementation "androidx.work:work-runtime:2.10.0"/' android/app/build.gradle
          grep -q work-runtime android/app/build.gradle
          # Every build gets a higher number, so a new version installs over the old one.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build and sign the apk
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android-key/kalenderkoll.keystore \
            -Pandroid.injected.signing.store.password=kalenderkoll-apk \
            -Pandroid.injected.signing.key.alias=kalenderkoll \
            -Pandroid.injected.signing.key.password=kalenderkoll-apk
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/Kalenderkoll.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalenderkoll-apk
          path: Kalenderkoll.apk
      - name: Put the apk on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Kalenderkoll för Android" --notes "Ladda ner Kalenderkoll.apk på telefonen och öppna filen för att installera. Första gången frågar telefonen om du vill tillåta installation från Chrome: välj Tillåt. Nya versioner installeras ovanpå den gamla, och allt ni lagt in finns kvar."
          gh release upload android Kalenderkoll.apk --clobber
